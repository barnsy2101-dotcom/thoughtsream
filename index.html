const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);

/* index 0 = neutral default; others are user-assignable */
const COLORS = [
  { bg: 'var(--bubble-bg-default)', border: 'var(--bubble-border-default)', text: 'var(--text-main)', dot: '#737373' },
  { bg: 'rgba(255,255,255,0.06)',  border: 'rgba(255,255,255,0.20)', text: 'var(--text-main)', dot: '#cccccc' },

/* ---------- simulated AI knowledge (fallback when no API key) ---------- */
const CATEGORIES = {
  'Marketing':          ['marketing','ads','advertising','seo','social','brand','branding','campaign','content','audience','promotion','influencer','newsletter','outreach'],
  'Revenue & Pricing':  ['revenue','pricing','price','subscription','monetize','monetization','sales','profit','paid','billing','freemium','tier','upsell','money'],
  'Product':            ['product','feature','features','mvp','prototype','roadmap','app','tool','integration','plugin'],
  'Launch & Timeline':  ['launch','timeline','deadline','schedule','ship','shipping','release','milestone','beta','sprint','quarter'],
  'Team & Hiring':      ['team','hire','hiring','recruit','founder','cofounder','engineer','designer','staff','culture','contractor'],
  'Technology':         ['api','backend','frontend','database','ai','llm','ml','cloud','infrastructure','stack','code','tech','automation'],
  'Users & Customers':  ['user','users','customer','customers','feedback','onboarding','retention','churn','community','support','persona'],
  'Growth':             ['growth','scale','scaling','viral','referral','referrals','acquisition','funnel','conversion','metrics','kpi','partnership'],
  'Design':             ['design','ui','ux','visual','layout','logo','style','aesthetic','wireframe'],
  'Risks & Challenges': ['risk','risks','competitor','competitors','challenge','problem','threat','legal','cost','costs','budget','burnout'],
};
const STOP = new Set(('the a an and or but if then of to in on for with we our is are be it this that i my me at as by from about into '
  + 'should could would can will need needs more less get make makes use using have has had do does did how what when where why who '
  + 'maybe also just really think thing things idea ideas new some every want wants like lets let go going lot very much so not no yes '
  + 'up out over under after before there here they them their you your one two too all any way ways good great big small pro con').split(' '));

const keywords = (text) => {
  const seen = new Set();
  return text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
    .filter(w => w.length > 2 && !STOP.has(w) && !seen.has(w) && seen.add(w));
};

const topicOf = (text) => {
  const kws = keywords(text);
  let best = null, bestN = 0;
  for (const [cat, list] of Object.entries(CATEGORIES)) {
    const n = kws.filter(k => list.includes(k)).length;
    if (n > bestN) { bestN = n; best = cat; }
  }
  return best;
};

/* ---------- persistence ---------- */

const saveStore = (s) => localStorage.setItem(LS_SESSIONS, JSON.stringify(s));

const blankWorld = () => ({
  id: uid(), name: 'Untitled Stream', nodes: [], links: [], suggestions: [], rejected: [], updated: Date.now(),
});

/* ---------- auto-framing / fit view ---------- */
const fitViewForNodes = (nodes) => {
  if (!nodes || !nodes.length) return { x: 0, y: 0, s: 1 };
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(n => {
    const r = n.r || 50;
    minX = Math.min(minX, (n.x || 0) - r);
    minY = Math.min(minY, (n.y || 0) - r);
    maxX = Math.max(maxX, (n.x || 0) + r);
    maxY = Math.max(maxY, (n.y || 0) + r);
  });
  let wWidth = maxX - minX;
  let wHeight = maxY - minY;
  if (wWidth < 200) { minX -= 100; maxX += 100; wWidth = 200; }
  if (wHeight < 200) { minY -= 100; maxY += 100; wHeight = 200; }

  const pad = 140;
  const ww = window.innerWidth || 1200;
  const wh = window.innerHeight || 800;
  const s = clamp(Math.min((ww - pad * 2) / wWidth, (wh - pad * 2) / wHeight), 0.45, 1.35);
  return {
    x: (ww - wWidth * s) / 2 - minX * s,
    y: (wh - wHeight * s) / 2 - minY * s,
    s
  };
};

/* ---------- physics helpers ---------- */
const CELL_SIZE = 300;

const applyCollisions = (nodes, hidden, bounds, fixed) => {
  const grid = new Map();
  for (const n of nodes) {
    n._isColliding = false;
    if (hidden.has(n.id) || !bounds[n.id]) continue;
    const cx = Math.floor(n.x / CELL_SIZE);
    const cy = Math.floor(n.y / CELL_SIZE);
    const key = `${cx},${cy}`;
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(n);
  }

  for (let iter = 0; iter < 3; iter++) {
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      if (hidden.has(a.id) || !bounds[a.id]) continue;
      
      const cx = Math.floor(a.x / CELL_SIZE);
      const cy = Math.floor(a.y / CELL_SIZE);
      
      for (let ox = -1; ox <= 1; ox++) {
        for (let oy = -1; oy <= 1; oy++) {
          const cell = grid.get(`${cx + ox},${cy + oy}`);
          if (!cell) continue;
          
          for (const b of cell) {
            if (a.id >= b.id) continue;
            if (a.sleeping && b.sleeping) continue;
            if (a.isPulling || b.isPulling) continue;
            if (!bounds[b.id]) continue;
            
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) dx = 0.01;
            
            const isParentChild = (a.isTopic && b.topicId === a.id) || (b.isTopic && a.topicId === a.id);
            const isThoughtToThought = !a.isTopic && !b.isTopic;
            const sameCluster = (a.topicId && a.topicId === b.topicId) || isParentChild;
            
            const pad = isParentChild ? 8 : sameCluster ? 24 : 16;
            const rx = bounds[a.id].w + bounds[b.id].w + pad;
            const ry = bounds[a.id].h + bounds[b.id].h + pad;
            
            const ex = dx / rx;
            const ey = dy / ry;
            const ed = Math.hypot(ex, ey) || 0.01;

            if (ed < 1.0) {
              if (a.sleeping) a.sleeping = false;
              if (b.sleeping) b.sleeping = false;
              a._isColliding = true;
              b._isColliding = true;

              const ratio = 1.0 - ed;
              const f = isParentChild ? ratio * 0.3 : (ratio * ratio * 0.4);
              
              let pushX = (ex / ed) * f * rx;
              let pushY = (ey / ed) * f * ry;

              if (Math.abs(dx) < 20) {
                const dir = dx || (a.id > b.id ? 1 : -1);
                pushX += (20 - Math.abs(dx)) * 0.15 * (dir >= 0 ? 1 : -1);
              }

              const maxF = isThoughtToThought ? 2.0 : 2.5;
              let fx = Math.min(Math.max(pushX, -maxF), maxF);
              let fy = Math.min(Math.max(pushY, -maxF), maxF);

              if (!fixed(a)) { a.vx -= fx; a.vy -= fy; }
              if (!fixed(b)) { b.vx += fx; b.vy += fy; }
            }
          }
        }
      }
    }
  }
};

const applyLinkForces = (links, byId, hidden, fixed, bounds) => {
  for (const l of links) {
    const a = byId(l.a), b = byId(l.b);
    if (!a || !b || hidden.has(a.id) || hidden.has(b.id)) continue;
    
    let dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 0.01;
    const rest = a.r + b.r + 70;
    const f = (d - rest) * 0.002;
    dx /= d; dy /= d;
    if (!fixed(a)) { a.vx += dx * f * d * 0.02; a.vy += dy * f * d * 0.02; }
    if (!fixed(b)) { b.vx -= dx * f * d * 0.02; b.vy -= dy * f * d * 0.02; }
  }
};

const applyTopicGravity = (nodes, hidden, bounds, fixed, held) => {
  const topicNodes = nodes.filter(n => n.isTopic && !hidden.has(n.id));
  for (const t of topicNodes) {
    const members = nodes.filter(n => n.topicId === t.id && !hidden.has(n.id));
    if (members.length === 0) continue;

    const sortedMembers = [...members].sort((a, b) => a.id.localeCompare(b.id));
    const N = sortedMembers.length;

    for (let idx = 0; idx < N; idx++) {
      const n = sortedMembers[idx];
      if (n.offsetX === undefined || n.offsetY === undefined || n.offsetX === null || n.offsetY === null) {
        const angle = (idx / N) * Math.PI * 2;
        const burstOffset = (n.burstIndex || 0) * 110;
        let R_x = t.r + n.r + 65;
        let R_y = R_x;
        if (bounds[n.id] && bounds[t.id]) {
            R_x = bounds[n.id].w + bounds[t.id].w + 35 + (idx % 2) * (N > 4 ? 40 : 0) + burstOffset;
            R_y = bounds[n.id].h + bounds[t.id].h + 35 + (idx % 2) * (N > 4 ? 40 : 0) + burstOffset;
        } else {
            R_x += (idx % 2) * (N > 4 ? 40 : 0) + burstOffset;
            R_y += (idx % 2) * (N > 4 ? 40 : 0) + burstOffset;
        }
        n.offsetX = Math.round(Math.cos(angle) * R_x);
        n.offsetY = Math.round(Math.sin(angle) * R_y);
      }

      let targetX = t.x + n.offsetX;
      let targetY = t.y + n.offsetY;

      if (n.isPulling) {
        const dTopicX = t.x - n.x;
        const dTopicY = t.y - n.y;
        
        let collisionDist = t.r + n.r + 5;
        if (bounds[n.id] && bounds[t.id]) {
            collisionDist = Math.max(bounds[n.id].w + bounds[t.id].w, bounds[n.id].h + bounds[t.id].h) + 5;
        }
        const distToTopic = Math.hypot(dTopicX, dTopicY);
        // Bounce off the topic bubble by becoming solid once we hit its perimeter
        if (distToTopic < collisionDist) {
          n.isPulling = false;
        } else {
          targetX = t.x;
          targetY = t.y;
        }
      }

      const dx = targetX - n.x;
      const dy = targetY - n.y;
      const dist = Math.hypot(dx, dy) || 0.01;

      if (held(n) && n.isPulling) n.isPulling = false;

      if (dist > 1.5 && !held(n) && !n.pinned && !n.userMoved) {
        if (n.sleeping) n.sleeping = false;
      }

      if (dist <= 1.5 && !held(n) && !n.pinned && !n.userMoved && !n._isColliding) {
        n.x = targetX;
        n.y = targetY;
        n.vx = 0;
        n.vy = 0;
        n.sleeping = true;
        n.isPulling = false;
      } else if (!fixed(n)) {
        if (n._isColliding && !held(t) && dist < 20) {
          n.offsetX = Math.round(n.x - t.x);
          n.offsetY = Math.round(n.y - t.y);
        } else {
          const pull = Math.min(Math.max(dist * 0.08, -3), 3);
          n.vx += (dx / dist) * pull;
          n.vy += (dy / dist) * pull;
        }

        let cdx = n.x - t.x;
        let cdy = n.y - t.y;
        if (Math.abs(cdx) < 0.01 && Math.abs(cdy) < 0.01) cdx = 0.01;
        
        const padT = 8;
        if (bounds[n.id] && bounds[t.id]) {
          const rxT = bounds[n.id].w + bounds[t.id].w + padT;
          const ryT = bounds[n.id].h + bounds[t.id].h + padT;
          
          const exT = cdx / rxT;
          const eyT = cdy / ryT;
          const edT = Math.hypot(exT, eyT) || 0.01;
          
          if (edT < 1.0) {
            let pushOut = Math.min((1.0 - edT) * 0.05 * Math.max(rxT, ryT), 2.5);
            n.vx += (exT / edT) * pushOut;
            n.vy += (eyT / edT) * pushOut;
            n._isColliding = true;
          }
        }
      }
    }
  }
};

const integrateVelocities = (nodes, hidden, fixed, byId) => {
  for (const n of nodes) {
    if (hidden.has(n.id) || fixed(n)) continue;
    const damp = 0.58;
    n.vx = Math.min(Math.max(n.vx * damp, -8), 8);
    n.vy = Math.min(Math.max(n.vy * damp, -8), 8);
    const speed = Math.hypot(n.vx, n.vy);
    if (speed < 0.1 && !n._isColliding) {
      n.vx = 0;
      n.vy = 0;
      n.sleeping = true;
      if (n.topicId) {
        const parentTopic = byId(n.topicId);
        if (parentTopic) {
          n.offsetX = Math.round(n.x - parentTopic.x);
          n.offsetY = Math.round(n.y - parentTopic.y);
        }
      }
    } else {
      n.x += n.vx; n.y += n.vy;
    }
  }
};

const renderCanvasDOM = (w, v, hidden, q, held, els) => {
  const { nodes, links, suggestions } = w;
  const { worldElRef, bgRef, nodeEls, zoneEls, pathEls, hitEls, labelEls, badgeEls, suggCardRef, linkCardRef, previewRef, threadLineRef } = els;
  
  if (worldElRef.current) worldElRef.current.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.s})`;
  if (bgRef.current) {
    bgRef.current.style.backgroundPosition = `${v.x}px ${v.y}px`;
    bgRef.current.style.backgroundSize = `${26 * v.s}px ${26 * v.s}px`;
  }
  const sel = els.selRef.current;
  for (const n of nodes) {
    const el = nodeEls.current[n.id];
    if (!el) continue;
    el.style.display = hidden.has(n.id) ? 'none' : '';
    el.style.transform = `translate(${n.x}px, ${n.y}px) translate(-50%, -50%)`;
    let z = 10;
    if (n.isTopic) z = 5;
    if (!n.isTopic && !n.isHub) z = 15;
    if (sel.has(n.id)) z = 20;
    if (held(n)) z = 1000;
    el.style.zIndex = z;
    const match = !q || (n.text + ' ' + (n.notes || '') + ' ' + (n.title || '')).toLowerCase().includes(q);
    el.style.opacity = match ? '1' : '0.14';
  }
  
  for (const n of nodes) {
    if (!n.isTopic) continue;
    const zel = zoneEls.current[n.id];
    if (!zel) continue;
    if (hidden.has(n.id)) { zel.style.display = 'none'; continue; }

    const members = nodes.filter(m => m.topicId === n.id && !hidden.has(m.id));
    let maxMemberR = n.r + 70;
    for (const m of members) {
      const dist = Math.hypot(m.x - n.x, m.y - n.y) + m.r + 40;
      if (dist > maxMemberR) maxMemberR = dist;
    }

    zel.style.display = '';
    zel.style.width = zel.style.height = (maxMemberR * 2) + 'px';
    zel.style.transform = `translate(${n.x}px, ${n.y}px) translate(-50%, -50%)`;
  }
  const curve = (a, b) => {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const off = Math.min(d * 0.14, 46);
    return `M ${a.x} ${a.y} Q ${mx - dy / d * off} ${my + dx / d * off} ${b.x} ${b.y}`;
  };
  const byId = (id) => nodes.find(n => n.id === id);
  for (const l of links) {
    const a = byId(l.a), b = byId(l.b);
    const vis = a && b && !hidden.has(a.id) && !hidden.has(b.id);
    const el = pathEls.current[l.id], hit = hitEls.current[l.id], lab = labelEls.current[l.id];
    if (el) { el.style.display = vis ? '' : 'none'; if (vis) el.setAttribute('d', curve(a, b)); }
    if (hit) { hit.style.display = vis ? '' : 'none'; if (vis) hit.setAttribute('d', curve(a, b)); }
    if (lab) { lab.style.display = vis && l.label ? '' : 'none'; if (vis) lab.style.transform = `translate(${(a.x + b.x) / 2}px, ${(a.y + b.y) / 2 + 10}px) translate(-50%, -50%)`; }
  }
  for (const s of suggestions) {
    const a = byId(s.a), b = byId(s.b);
    const vis = a && b && !hidden.has(a.id) && !hidden.has(b.id) && els.replayRef.current === null && !els.pureDumpRef.current;
    const el = pathEls.current[s.id], badge = badgeEls.current[s.id];
    if (el) { el.style.display = vis ? '' : 'none'; if (vis) el.setAttribute('d', curve(a, b)); }
    if (badge) { badge.style.display = vis ? '' : 'none'; if (vis) badge.style.transform = `translate(${(a.x + b.x) / 2}px, ${(a.y + b.y) / 2}px) translate(-50%, -50%)`; }
  }
  if (els.activeSuggRef.current && suggCardRef.current) {
    const s = suggestions.find(x => x.id === els.activeSuggRef.current);
    const a = s && byId(s.a), b = s && byId(s.b);
    if (a && b) suggCardRef.current.style.transform = `translate(${(a.x + b.x) / 2}px, ${(a.y + b.y) / 2 + 26}px) translate(-50%, 0)`;
  }
  if (els.activeLinkRef.current && linkCardRef.current) {
    const l = links.find(x => x.id === els.activeLinkRef.current);
    const a = l && byId(l.a), b = l && byId(l.b);
    if (a && b) linkCardRef.current.style.transform = `translate(${(a.x + b.x) / 2}px, ${(a.y + b.y) / 2 + 22}px) translate(-50%, 0)`;
  }
  if (previewRef.current) {
    const src = els.linkFromRef.current && byId(els.linkFromRef.current);
    if (src) {
      previewRef.current.setAttribute('d', `M ${src.x} ${src.y} L ${els.mouseRef.current.x} ${els.mouseRef.current.y}`);
      previewRef.current.style.display = '';
    } else previewRef.current.style.display = 'none';
  }
  if (threadLineRef.current) {
    const t = els.targetRef.current && byId(els.targetRef.current);
    if (t && !hidden.has(t.id)) {
      const p = els.screenToWorld(window.innerWidth / 2, window.innerHeight - 100);
      threadLineRef.current.setAttribute('d', `M ${t.x} ${t.y} L ${p.x} ${p.y}`);
      threadLineRef.current.style.display = '';
    } else threadLineRef.current.style.display = 'none';
  }

  if (els.pullTetherGroupRef && els.pullTetherGroupRef.current) {
    const selIds = els.selRef.current;
    const hoverId = els.hoveredPullTopicIdRef.current;
    if (selIds.size > 0 && hoverId) {
      const target = byId(hoverId);
      if (target && !hidden.has(target.id)) {
        let paths = '';
        for (const id of selIds) {
          const n = byId(id);
          if (n && !hidden.has(n.id) && n.id !== hoverId) {
            paths += `<path d="M ${n.x} ${n.y} L ${target.x} ${target.y}" fill="none" stroke="rgba(200,200,200,0.6)" stroke-width="2.5" stroke-dasharray="6,6" />`;
          }
        }
        els.pullTetherGroupRef.current.innerHTML = paths;
        els.pullTetherGroupRef.current.style.display = '';
      } else {
        els.pullTetherGroupRef.current.style.display = 'none';
      }
    } else {
      els.pullTetherGroupRef.current.style.display = 'none';
    }
  }

  if (els.sourceTetherGroupRef && els.sourceTetherGroupRef.current) {
    let paths = '';
    for (const n of w.nodes) {
      if (n.topicId && !hidden.has(n.id)) {
        const t = w.nodes.find(node => node.id === n.topicId);
        if (t && !hidden.has(t.id) && t.isSourceAnchor) {
          paths += `<path d="M ${n.x} ${n.y} L ${t.x} ${t.y}" fill="none" stroke="rgba(200,200,200,0.15)" stroke-width="2" stroke-dasharray="4,4" />`;
        }
      }
    }
    els.sourceTetherGroupRef.current.innerHTML = paths;
  }
};

      const assignedTopic = topicOf(n.text);
      
      const isDirectMatch = textLower.includes(topTitle) || (topTitle.length >= 3 && topTitle.includes(textLower));
      const isTopicOfMatch = assignedTopic && assignedTopic.toLowerCase() === topTitle;
      const isKwMatch = topKws.length > 0 && topKws.some(k => tKws.includes(k));
      const isCatMatch = catKws.length > 0 && catKws.some(k => tKws.some(tk => tk.includes(k) || k.includes(tk)));

  /* ---------- AI engine ---------- */
  const applyAIResults = (connections, metaHubs) => {
    const w = worldRef.current;
    const taken = new Set([
      ...w.links.map(l => pairKey(l.a, l.b)),
      ...w.suggestions.map(s => s.type === 'pair' ? pairKey(s.a, s.b) : (s.title || '').toLowerCase()),
      ...w.rejected,
    ]);
    let budget = 8 - w.suggestions.length;
    let changed = false;

    for (const hub of metaHubs) {
      const members = hub.thoughtIds.map(byId).filter(Boolean);
      if (members.length < 2) continue;
      const key = hub.title.toLowerCase();
      const existingHub = w.nodes.find(n => (n.isHub || n.isTopic) && n.title.toLowerCase() === key);
      if (!taken.has(key) && budget > 0) {
        w.suggestions.push({
          id: uid(),
          type: 'metaHub',
          title: hub.title,
          thoughtIds: members.map(m => m.id),
          existingHubId: existingHub ? existingHub.id : null,
          reason: `Group ${members.length} thoughts into '${hub.title}'`,
        });
        taken.add(key);
        budget--;
        changed = true;
      }
    }

    for (const c of connections) {
      if (budget <= 0) break;
      const a = byId(c.fromId), b = byId(c.toId);
      if (!a || !b || a.id === b.id) continue;
      const k = pairKey(a.id, b.id);
      if (taken.has(k)) continue;
      w.suggestions.push({
        id: uid(),
        type: 'pair',
        a: a.id,
        b: b.id,
        reason: c.reason,
      });
      taken.add(k);
      budget--;
      changed = true;
    }
    if (changed) { w.updated = Date.now(); bump(); }
  };

  const simulateAI = () => {
    const w = worldRef.current;
    const thoughts = w.nodes.filter(n => !n.isTopic && !n.isHub && !n.topicId && n.text.trim());
    const connections = [];
    const metaHubs = [];
    const kwCache = new Map(thoughts.map(t => [t.id, keywords(t.text)]));
    const topic = new Map(thoughts.map(t => [t.id, topicOf(t.text)]));

    const byTopic = {};
    for (const t of thoughts) { const c = topic.get(t.id); if (c) (byTopic[c] = byTopic[c] || []).push(t.id); }
    for (const [cat, ids] of Object.entries(byTopic)) {
      const hubExists = w.nodes.some(n => (n.isHub || n.isTopic) && n.title === cat);
      if (ids.length >= 3 || (hubExists && ids.length >= 1)) metaHubs.push({ title: cat, thoughtIds: ids });
    }

    for (let i = 0; i < thoughts.length; i++) {
      const ka = kwCache.get(thoughts[i].id), ca = topic.get(thoughts[i].id);
      for (let j = i + 1; j < thoughts.length; j++) {
        const kb = kwCache.get(thoughts[j].id), cb = topic.get(thoughts[j].id);
        const shared = ka.filter(x => kb.includes(x));
        let reason = null;
        if (ca && ca === cb) reason = `Both about ${ca}`;
        else if (shared.length >= 2) reason = `Shared focus: ${shared.slice(0, 2).join(', ')}`;
        if (reason) connections.push({ fromId: thoughts[i].id, toId: thoughts[j].id, reason });
      }
    }
    applyAIResults(connections, metaHubs);
  };

    const res = await fetch('https://api.anthropic.com/v1/messages', {

        'content-type': 'application/json',
        'x-api-key': apiKeyRef.current,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',

      body: JSON.stringify({
        model: 'claude-opus-4-8',
        max_tokens: maxTokens,

  };
  const seedTemplate = (name) => {
    pushUndo();
    TEMPLATES[name].forEach((t, i) => setTimeout(() => addThought(t, { skipUndo: true }), i * 320));
  };

  const getActiveSuggestionPill = () => {
    const w = worldRef.current;
    if (!w || !w.suggestions || w.suggestions.length === 0) return null;
    const s = w.suggestions[0];
    if (s.type === 'metaHub') {
      return { text: `Group under "${s.title}"`, suggestion: s };
    }
    if (s.type === 'pair') {
      const a = byId(s.a), b = byId(s.b);
      if (a && b) {
        return { text: `Link "${a.text.slice(0, 20)}..." & "${b.text.slice(0, 20)}..."`, suggestion: s };
      }
    }
    return null;
  };

  const acceptPillSuggestion = () => {
    const pill = getActiveSuggestionPill();
    if (!pill) return;
    const s = pill.suggestion;
    const w = worldRef.current;
    pushUndo();
    if (s.type === 'metaHub') {
      let hub = w.nodes.find(n => (n.isHub || n.isTopic) && n.title && n.title.toLowerCase() === s.title.toLowerCase());
      if (!hub) {
        const spawnPos = screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
        hub = {
          id: uid(), text: s.title, title: s.title, notes: '', color: 0,
          x: spawnPos.x, y: spawnPos.y, vx: 0, vy: 0, r: 74, isTopic: true, topicId: null,
          released: false, created: Date.now()
        };
        w.nodes.push(hub);
      }
      (s.thoughtIds || []).forEach(tid => {
        const child = byId(tid);
        if (child) {
          child.topicId = hub.id;
          if (!w.links.some(l => pairKey(l.a, l.b) === pairKey(hub.id, child.id))) {
            w.links.push({ id: uid(), a: hub.id, b: child.id });
          }
        }
      });
      w.suggestions = w.suggestions.filter(x => x.id !== s.id);
    } else if (s.type === 'pair') {
      createLink(s.a, s.b, true);
      w.suggestions = w.suggestions.filter(x => x.id !== s.id);
    }
    w.updated = Date.now();
    bump();
  };

  const dismissPillSuggestion = () => {
    const pill = getActiveSuggestionPill();
    if (!pill) return;
    const s = pill.suggestion;
    const w = worldRef.current;
    w.suggestions = w.suggestions.filter(x => x.id !== s.id);
    if (s.type === 'metaHub') {
      w.rejected.push(s.title.toLowerCase());
    } else if (s.type === 'pair') {
      w.rejected.push(pairKey(s.a, s.b));
    }
    w.updated = Date.now();
    bump();
  };

  /* ---------- render ---------- */
  const w = worldRef.current;
  const modalNode = modalId && byId(modalId);
  const targetNode = targetId && byId(targetId);
  const topics = w.nodes.filter(n => n.isTopic);
  const activeTopicNode = activeTopic && byId(activeTopic);
  const suggCard = activeSugg && w.suggestions.find(s => s.id === activeSugg);
  const linkCard = activeLink && w.links.find(l => l.id === activeLink);
  const store = loadStore();
  const sessionList = Object.values(store).sort((a, b) => b.updated - a.updated);
  const replaying = replayIdx !== null;
  const activeSuggestionPill = getActiveSuggestionPill();

  return (
    <div ref={containerRef} className={`fixed inset-0 select-none ${activeSorterTopicId ? 'cursor-crosshair' : ''}`} onPointerDown={onBackgroundDown}>
      <div id="bg-grad" />
      <div id="bg-dots" ref={bgRef} />

      {/* world layer */}
      <div ref={worldElRef} className="absolute inset-0" style={{ transformOrigin: '0 0' }}>
        {/* topic gravity zones (behind everything) */}
        {w.nodes.filter(n => n.isTopic).map(n => (
          <div key={'zone' + n.id} className="topic-zone" ref={el => { if (el) zoneEls.current[n.id] = el; }}
            style={{
              background: theme === 'light'
                ? 'radial-gradient(circle at center, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.10) 40%, rgba(0,0,0,0) 75%)'
                : 'radial-gradient(circle at center, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0) 75%)',
              border: 'none',
              filter: 'blur(8px)',
              display: 'none'
            }} />
        ))}
        <svg className="absolute" style={{ overflow: 'visible', width: 1, height: 1 }}>
          {w.links.map(l => (
            <g key={l.id}>
              <path ref={el => { if (el) pathEls.current[l.id] = el; }}
                className="link-path" fill="none" stroke="rgba(160,160,160,0.35)" strokeWidth="2" strokeLinecap="round" />
              <path ref={el => { if (el) hitEls.current[l.id] = el; }}
                fill="none" stroke="transparent" strokeWidth="20" style={{ pointerEvents: 'stroke', cursor: 'pointer' }}
                onPointerDown={e => e.stopPropagation()}
                onClick={e => { e.stopPropagation(); setActiveLink(activeLink === l.id ? null : l.id); setActiveSugg(null); }} />
            </g>
          ))}

          <path ref={previewRef} fill="none" stroke="rgba(220,220,220,0.65)" strokeWidth="2"
            strokeDasharray="5 5" style={{ display: 'none', pointerEvents: 'none' }} />
          <path ref={threadLineRef} fill="none" stroke="rgba(160,160,160,0.30)" strokeWidth="1.5"
            strokeDasharray="4 7" style={{ display: 'none', pointerEvents: 'none' }} />
          <g ref={sourceTetherGroupRef} style={{ pointerEvents: 'none' }} />
          <g ref={pullTetherGroupRef} style={{ display: 'none', pointerEvents: 'none' }} />
        </svg>

        {/* spawn / delete particle bursts */}
        {(w.bursts || []).map(b => {
          const count = b.big ? 16 : 8;
          const base = b.big ? 60 : 30;
          const spread = b.big ? 34 : 16;
          const col = b.color || 'rgba(200,200,200,0.85)';
          return (
            <div key={b.id} className="burst absolute left-0 top-0 pointer-events-none"
              style={{ transform: `translate(${b.x}px, ${b.y}px)`, zIndex: 5 }}>
              {b.big && (
                <span className="pop" style={{
                  left: -(b.r || 40) + 'px', top: -(b.r || 40) + 'px',
                  width: (b.r || 40) * 2 + 'px', height: (b.r || 40) * 2 + 'px',
                  borderRadius: '9999px', border: `2px solid ${col}`, background: 'transparent',
                  animation: 'pop-ring 0.5s ease-out forwards',
                }} />
              )}
              {Array.from({ length: count }).map((_, i) => {
                const ang = (i / count) * Math.PI * 2 + 0.4;
                const dist = base + (i % 3) * spread;
                return <span key={i} style={{
                  '--dx': Math.cos(ang) * dist + 'px', '--dy': Math.sin(ang) * dist + 'px',
                  background: i % 2 ? col : 'rgba(220,220,220,0.85)',
                }} />;
              })}
            </div>
          );
        })}

        {/* link labels */}
        {w.links.filter(l => l.label).map(l => (
          <span key={'lab' + l.id} ref={el => { if (el) labelEls.current[l.id] = el; }}
            className="absolute left-0 top-0 text-[11px] text-neutral-300/90 px-2 py-0.5 rounded-md will-change-transform pointer-events-none"
            style={{ background: 'rgba(13,21,38,0.85)', border: '1px solid rgba(148,163,184,0.2)' }}>
            {l.label}
          </span>
        ))}



        {/* link edit card */}
        {linkCard && (
          <div data-ui ref={linkCardRef} onPointerDown={e => e.stopPropagation()}
            className="glass absolute left-0 top-0 rounded-xl p-3 w-56 z-20 will-change-transform">
            <div className="text-[11px] uppercase tracking-wider text-neutral-500 mb-1">Connection label</div>
            <input defaultValue={linkCard.label || ''} placeholder="e.g. depends on…" autoFocus
              onChange={e => { linkCard.label = e.target.value; worldRef.current.updated = Date.now(); }}
              onBlur={bump} onKeyDown={e => e.key === 'Enter' && (bump(), setActiveLink(null))}
              className="w-full bg-neutral-800/60 border border-neutral-600/40 rounded-lg px-2.5 py-1.5 text-neutral-100 text-sm mb-2" />
            <div className="flex gap-2">
              <button onClick={() => { bump(); setActiveLink(null); }}
                className="flex-1 text-xs bg-neutral-800 hover:bg-neutral-700 border border-neutral-600 text-neutral-100 rounded-lg py-1.5">Done</button>
              <button onClick={() => unlink(linkCard.id)}
                className="flex-1 text-xs bg-red-500/10 hover:bg-red-500/25 border border-red-400/30 text-red-300 rounded-lg py-1.5">Unlink</button>
            </div>
          </div>
        )}

        {/* bubbles */}
        {w.nodes.map(n => {
          const c = COLORS[n.color % COLORS.length];
          const isSource = linkFrom === n.id;
          const isSel = selIds.has(n.id);
          const memberCount = n.isHub ? hubMembers(n.id).length : 0;
          const isVacuumHighlighted = vacuumTopicId && vacuumSelectedIds.has(n.id);
          const isVacuumTargetTopic = vacuumTopicId === n.id;
          const nodeOpacity = vacuumTopicId ? (isVacuumTargetTopic || isVacuumHighlighted ? 1 : (n.topicId && n.topicId !== vacuumTopicId ? 0.35 : 0.6)) : undefined;
          return (
            <div key={n.id} data-bubble data-id={n.id}
              ref={el => { 
                if (el) {
                  nodeEls.current[n.id] = el;
                  if (!observedNodes.current.has(el)) {
                    resizeObserver.current?.observe(el);
                    observedNodes.current.add(el);
                    nodeBounds.current[n.id] = { w: el.offsetWidth / 2, h: el.offsetHeight / 2 };
                  }
                }
              }}
              onPointerDown={onBubbleDown(n)}
              onDoubleClick={e => { e.stopPropagation(); setModalId(n.id); }}
              onMouseEnter={() => { if (n.isTopic && selIds.size > 0) setHoveredPullTopicId(n.id); }}
              onMouseLeave={() => { if (n.isTopic) setHoveredPullTopicId(null); }}
              className="bubble transition-opacity duration-200"
              style={{ opacity: nodeOpacity, cursor: (activeSorterTopicId && !n.isTopic && !n.isHub) || isVacuumHighlighted ? 'pointer' : undefined }}>
                {n.isBurstStart && n.burstTimeStr && (
                  <div className="burst-pill">{n.burstTimeStr}</div>
                )}
                <div className={'bubble-core relative rounded-2xl flex flex-col items-center justify-center text-center px-5 py-3.5 '
                  + (n.isHub ? 'hub-glow' : '') + (n.isTopic ? 'topic-glow' : '') + (n.pinned ? ' pinned-core' : '') + (targetId === n.id ? ' target-ring' : '')
                  + (isVacuumHighlighted ? ' vacuum-highlight' : '') + (isSel && !n.isTopic ? ' ring-2 ring-neutral-300 ring-offset-1' : '')}
                style={{
                  background: n.isHub || n.isTopic
                    ? (theme === 'light' ? '#FFFFFF' : '#2A2A2A')
                    : (n.topicId && n.color === 0 ? 'var(--surface-bg)' : c.bg),
                  border: n.isHub || n.isTopic
                    ? `1.5px solid ${isVacuumTargetTopic || isSel || targetId === n.id || activeTopic === n.id ? (theme === 'light' ? '#000000' : '#FFFFFF') : (theme === 'light' ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.20)')}`
                    : `1px solid ${isSource || isSel || targetId === n.id ? (theme === 'light' ? '#000000' : '#FFFFFF') : (n.topicId && n.color === 0 ? 'var(--surface-border)' : c.border)}`,
                  color: theme === 'light' ? '#1B1B1B' : '#EAEAEA',
                  boxShadow: n.isHub || n.isTopic
                    ? (theme === 'light' ? '0 12px 32px rgba(0,0,0,0.06)' : '0 12px 32px rgba(0,0,0,0.25)')
                    : 'var(--surface-shadow)',
                  maxWidth: n.isHub ? 260 : n.isTopic ? 240 : 250,
                  minWidth: n.isHub || n.isTopic ? 170 : 0,
                  ...(isSel || isVacuumTargetTopic ? { outline: `2px solid ${theme === 'light' ? '#000000' : '#FFFFFF'}`, outlineOffset: 3 } : {}),
                }}>
                {n.isTopic && selIds.size > 0 && (
                  <div
                    className="absolute -top-3 right-0 bg-neutral-200 text-neutral-900 text-[10px] font-bold px-2 py-0.5 rounded-full cursor-pointer hover:bg-white shadow border border-neutral-300 transition-colors pointer-events-auto"
                    onPointerDown={(e) => { e.stopPropagation(); executeManualPull(n.id); }}
                  >
                    Pull ({selIds.size})
                  </div>
                )}
                {isVacuumTargetTopic && (
                  <div data-ui
                    onPointerDown={e => e.stopPropagation()}
                    className="absolute -top-12 left-1/2 -translate-x-1/2 flex items-center gap-1.5 px-2.5 py-1 rounded-full border z-30 animate-pop-in pointer-events-auto whitespace-nowrap"
                    style={{
                      background: theme === 'light' ? '#FFFFFF' : '#2A2A2A',
                      color: theme === 'light' ? '#1B1B1B' : '#EAEAEA',
                      borderColor: theme === 'light' ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.20)',
                      boxShadow: theme === 'light' ? '0 8px 24px rgba(0,0,0,0.14)' : '0 8px 24px rgba(0,0,0,0.5)',
                    }}>
                    <button type="button"
                      onClick={e => { e.stopPropagation(); confirmVacuum(); }}
                      className="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition-all bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm"
                      title={`Confirm: Pull ${vacuumSelectedIds.size} thought${vacuumSelectedIds.size === 1 ? '' : 's'} into this topic`}>
                      <CheckIcon size={13} />
                      <span>Pull {vacuumSelectedIds.size}</span>
                    </button>
                    <button type="button"
                      onClick={e => { e.stopPropagation(); cancelVacuum(); }}
                      className="p-1 rounded-full text-xs font-semibold hover:bg-neutral-700/40 text-neutral-400 hover:text-neutral-200 transition-colors"
                      title="Cancel Vacuum mode">
                      <XIcon size={13} />
                    </button>
                  </div>
                )}
                {n.isHub && (
                  <span className="flex items-center gap-1 text-[11px] uppercase tracking-wider font-semibold mb-1"
                    style={{ color: theme === 'light' ? '#666666' : '#A3A3A3' }}>
                    <SparkIcon size={12} /> Meta-Hub{n.collapsed ? ` · ${memberCount}` : ''}
                  </span>
                )}
                {n.isTopic && (
                  <div className="flex items-center justify-between w-full mb-1 gap-2">
                    <span className="text-[11px] uppercase tracking-wider font-semibold truncate"
                      style={{ color: theme === 'light' ? '#666666' : '#A3A3A3' }}>
                      ◆ Topic{activeTopic === n.id ? ' · active' : ''}
                    </span>
                    <div className="flex items-center gap-1 shrink-0">
                      <button data-ui
                        type="button"
                        onPointerDown={e => e.stopPropagation()}
                        onClick={e => { e.stopPropagation(); exportTopicMarkdown(n); }}
                        title="Copy Raw Markdown"
                        className={'p-1 rounded-md transition-colors flex items-center justify-center '
                          + (theme === 'light' ? 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/60' : 'text-neutral-400 hover:text-neutral-200 hover:bg-neutral-700/50')}>
                        <CopyIcon size={13} />
                      </button>
                      <button data-ui
                        type="button"
                        onPointerDown={e => e.stopPropagation()}
                        onClick={e => { e.stopPropagation(); toggleVacuumPreview(n); }}
                        title={isVacuumTargetTopic ? "Exit Smart Vacuum preview" : "Smart Vacuum: scan for matching thoughts"}
                        className={'p-1 rounded-md transition-colors flex items-center justify-center '
                          + (isVacuumTargetTopic ? (theme === 'light' ? 'bg-gray-200 text-gray-900 font-bold' : 'bg-neutral-700 text-neutral-100 font-bold') : (theme === 'light' ? 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/60' : 'text-neutral-400 hover:text-neutral-200 hover:bg-neutral-700/50'))}>
                        <MagnetIcon size={13} />
                      </button>
                    </div>
                  </div>
                )}
                <span className={n.isHub || n.isTopic ? 'font-display font-bold text-[20px] sm:text-[22px] leading-snug' : 'text-[15px] sm:text-[16px] leading-relaxed font-semibold'}
                  style={{ wordBreak: 'break-word', color: theme === 'light' ? '#1B1B1B' : '#EAEAEA' }}>
                  {n.isHub || n.isTopic ? n.title : n.text}
                </span>
                {!n.isHub && n.notes && <span className="mt-1 w-1.5 h-1.5 rounded-full" style={{ background: c.dot === '#737373' ? ACCENT : c.dot }} title="Has notes" />}
                {n.metadata && n.metadata.url && (
                  <a href={n.metadata.url} target="_blank" rel="noopener noreferrer" 
                     className="mt-2 flex items-center gap-1.5 px-2 py-1 rounded-md text-[10px] transition-colors overflow-hidden max-w-full"
                     style={{ 
                       background: theme === 'light' ? 'rgba(0,0,0,0.05)' : 'rgba(0,0,0,0.2)', 
                       border: `1px solid ${theme === 'light' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)'}`,
                       color: theme === 'light' ? '#666' : 'rgba(255,255,255,0.7)' 
                     }}
                     onPointerDown={e => e.stopPropagation()}
                     onMouseEnter={e => { e.currentTarget.style.background = theme === 'light' ? 'rgba(0,0,0,0.08)' : 'rgba(0,0,0,0.4)'; e.currentTarget.style.color = theme === 'light' ? '#000' : '#FFF'; }}
                     onMouseLeave={e => { e.currentTarget.style.background = theme === 'light' ? 'rgba(0,0,0,0.05)' : 'rgba(0,0,0,0.2)'; e.currentTarget.style.color = theme === 'light' ? '#666' : 'rgba(255,255,255,0.7)'; }}>
                    {n.metadata.favicon && <img src={n.metadata.favicon} alt="" className="w-3 h-3 rounded-sm opacity-80" />}
                    <span className="truncate font-semibold">{(() => { try { return new URL(n.metadata.url).hostname.replace('www.', ''); } catch(e) { return n.metadata.url; } })()}</span>
                  </a>
                )}
                <button data-ui
                  onPointerDown={e => {
                    e.stopPropagation(); e.preventDefault();
                    setLinkFrom(n.id);
                    linkDragRef.current = { from: n.id, moved: false, sx: e.clientX, sy: e.clientY };
                  }}
                  className="link-handle absolute -top-2 -right-2 w-7 h-7 rounded-full flex items-center justify-center text-neutral-200"
                  style={{ background: 'rgba(30,41,59,0.95)', border: '1px solid rgba(255,255,255,0.25)', opacity: isSource ? 1 : undefined, touchAction: 'none' }}
                  title={isSource ? 'Drag to a bubble to link · click again to cancel' : 'Drag to another bubble to link'}>
                  <LinkIcon size={13} />
                </button>
                <button data-ui
                  onPointerDown={e => e.stopPropagation()}
                  onClick={e => { e.stopPropagation(); pushUndo(); n.pinned = !n.pinned; n.vx = 0; n.vy = 0; worldRef.current.updated = Date.now(); bump(); }}
                  className={'link-handle absolute -bottom-2 -right-2 w-7 h-7 rounded-full flex items-center justify-center '
                    + (n.pinned ? 'text-amber-300' : 'text-neutral-300')}
                  style={{ background: n.pinned ? 'rgba(60,45,10,0.95)' : 'rgba(30,41,59,0.95)', border: '1px solid ' + (n.pinned ? 'rgba(251,191,36,0.6)' : 'rgba(148,163,184,0.4)'), opacity: n.pinned ? 1 : undefined, touchAction: 'none' }}
                  title={n.pinned ? 'Unpin — let it drift again' : 'Pin in place — others get pulled toward it'}>
                  <PinIcon size={12} />
                </button>
                <button data-ui
                  onPointerDown={e => e.stopPropagation()}
                  onClick={e => { e.stopPropagation(); setTargetId(targetId === n.id ? null : n.id); }}
                  className="link-handle absolute -bottom-2 -left-2 w-7 h-7 rounded-full flex items-center justify-center text-neutral-200"
                  style={{ background: targetId === n.id ? 'rgba(255,255,255,0.25)' : 'rgba(30,41,59,0.95)', border: '1px solid rgba(255,255,255,0.25)', opacity: targetId === n.id ? 1 : undefined, touchAction: 'none' }}
                  title={targetId === n.id ? 'Replying here — click to stop' : 'Reply to this: new thoughts link here'}>
                  <MsgIcon size={12} />
                </button>
                {!n.isHub && n.isQuestion && (
                  <span className="absolute -top-2 -left-2 w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-semibold text-neutral-200 pointer-events-none"
                    style={{ background: 'rgba(30,41,59,0.95)', border: '1px solid rgba(255,255,255,0.25)' }}
                    title="Question — replies thread here">?</span>
                )}
                {n.topicId && !n.isTopic && !n.isHub && (
                  <button data-ui
                    onPointerDown={e => e.stopPropagation()}
                    onClick={e => { e.stopPropagation(); pushUndo(); n.topicId = null; n.sleeping = false; const v = viewRef.current; const f = document.getElementById('main-chat-form'); if(f){ const r=f.getBoundingClientRect(); n.x = (r.left + r.width/2 - v.x)/v.s; n.y = (r.top - 40 - v.y)/v.s; } else { n.x = (window.innerWidth / 2 - v.x) / v.s; n.y = (window.innerHeight - 150 - v.y) / v.s; } n.vx = 0; n.vy = 0; worldRef.current.updated = Date.now(); bump(); }}
                    className="link-handle absolute -top-3 left-1/2 -translate-x-1/2 w-7 h-7 rounded-full flex items-center justify-center text-red-300 hover:bg-red-950 transition-colors"
                    style={{ background: 'rgba(30,41,59,0.95)', border: '1px solid rgba(239,68,68,0.4)', touchAction: 'none' }}
                    title="Detach from topic">
                    <MinusIcon size={14} />
                  </button>
                )}
                {n.isHub && (
                  <button data-ui
                    onPointerDown={e => e.stopPropagation()}
                    onClick={e => { e.stopPropagation(); n.collapsed = !n.collapsed; worldRef.current.updated = Date.now(); bump(); }}
                    className="hub-toggle absolute -top-2 -left-2 w-6 h-6 rounded-full flex items-center justify-center text-neutral-200"
                    style={{ background: 'rgba(30,41,59,0.95)', border: '1px solid rgba(255,255,255,0.25)', opacity: n.collapsed ? 1 : undefined }}
                    title={n.collapsed ? 'Expand cluster' : 'Collapse cluster'}>
                    {n.collapsed ? <UnfoldIcon size={12} /> : <FoldIcon size={12} />}
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* marquee */}
      {marquee && (
        <div className="absolute pointer-events-none z-30 rounded"
          style={{ left: marquee.x, top: marquee.y, width: marquee.w, height: marquee.h,
            background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.25)' }} />
      )}

      {/* empty state */}
      {!w.nodes.length && (
        <div className="absolute inset-0 flex items-center justify-center">
          <div className="text-center text-neutral-500 pointer-events-none">
            <div className="text-4xl mb-3 text-neutral-500/60">✦</div>
            <p className="font-display text-xl text-neutral-400">Type a thought below and press Enter.</p>
            <p className="text-sm mt-1.5 text-neutral-600">The AI weaves connections as ideas pile up.</p>
            <div className="flex gap-2 justify-center mt-5 pointer-events-auto" data-ui>
              {Object.keys(TEMPLATES).map(name => (
                <button key={name} onClick={() => seedTemplate(name)}
                  className="ghost-btn text-xs text-neutral-400 border border-neutral-600/40 rounded-full px-3.5 py-1.5">
                  {name}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* linking / replay / quick-sorter hint */}

            {topics.map(t => (
              <div key={t.id} className="flex items-center gap-1 w-full">
                <button type="button" onClick={() => { setActiveTopic(t.id); setTopicMenuOpen(false); }}
                  className={'ghost-btn flex-1 text-left text-[13px] rounded-xl px-3 py-2 flex items-center gap-2 min-w-0 ' + (activeTopic === t.id ? 'text-neutral-100 font-semibold' : 'text-neutral-300')}>
                  <span className="w-2 h-2 rounded-full shrink-0" style={{ background: activeTopic === t.id ? TOPIC_ACCENT : 'transparent', border: '1px solid ' + TOPIC_ACCENT }} />
                  <span className="truncate flex-1">{t.title}</span>
                  <span className="text-neutral-600 text-[11px] shrink-0">{w.nodes.filter(n => n.topicId === t.id).length}</span>
                </button>
                <button type="button" onClick={() => { setActiveSorterTopicId(activeSorterTopicId === t.id ? null : t.id); setTopicMenuOpen(false); }}
                  title={activeSorterTopicId === t.id ? "Disable Quick-Sorter" : `Enable Quick-Sorter: click bubbles to send them to "${t.title}"`}
                  className={'w-8 h-8 rounded-lg flex items-center justify-center shrink-0 border transition-colors ' + (activeSorterTopicId === t.id ? 'text-amber-300 bg-amber-500/20 border-amber-400/40' : 'text-neutral-500 hover:text-neutral-300 border-transparent hover:bg-neutral-700/40')}>
                  <SparkIcon size={12} className={activeSorterTopicId === t.id ? "animate-pulse" : ""} />
                </button>
              </div>
            ))}
            <div className="flex items-center gap-1.5 mt-1 pt-1.5 border-t border-neutral-700/50 px-1">
              <input value={newTopicName} onChange={e => setNewTopicName(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); if (newTopicName.trim()) { createTopic(newTopicName); setNewTopicName(''); setTopicMenuOpen(false); } } }}
                placeholder="New topic…" autoComplete="off"
                className="flex-1 bg-neutral-800/60 border border-neutral-600/40 rounded-lg px-2.5 py-1.5 text-neutral-100 text-[13px] min-w-0" />
              <button type="button" onClick={() => { if (newTopicName.trim()) { createTopic(newTopicName); setNewTopicName(''); setTopicMenuOpen(false); } }}
                className="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-neutral-100 bg-neutral-800 hover:bg-neutral-700 border border-neutral-600">
                <PlusIcon size={15} />
              </button>
            </div>
          </div>
        )}
        <div className="glass spotlight-bar flex items-center gap-2 pl-3 pr-2 py-2">
          <button type="button" onClick={() => setTopicMenuOpen(o => !o)}
            title={activeSorterTopicId ? `Quick-Sorter active for: ${byId(activeSorterTopicId)?.title}` : "Choose a topic — new thoughts drift into its cluster"}
            className="flex items-center gap-1.5 shrink-0 rounded-full px-3 h-9 text-[13px] border max-w-[140px] transition-colors"
            style={{
              background: activeSorterTopicId
                ? 'rgba(245,158,11,0.15)'
                : (theme === 'light' ? '#F3F4F6' : '#2A2A2A'),
              borderColor: activeSorterTopicId
                ? 'rgba(245,158,11,0.4)'
                : (theme === 'light' ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.15)'),
              color: activeSorterTopicId
                ? '#FCD34D'
                : (theme === 'light' ? '#1B1B1B' : '#EAEAEA'),
              fontWeight: activeTopicNode ? 600 : 500
            }}>
            <span className="shrink-0" style={{ color: activeSorterTopicId ? '#FCD34D' : (theme === 'light' ? '#1B1B1B' : '#EAEAEA') }}>{activeSorterTopicId ? '⚡' : '◆'}</span>
            <span className="truncate" style={{ color: activeSorterTopicId ? '#FCD34D' : (theme === 'light' ? '#1B1B1B' : '#EAEAEA') }}>{activeSorterTopicId ? byId(activeSorterTopicId)?.title : activeTopicNode ? activeTopicNode.title : '+ Topic'}</span>
          </button>
          <input id="thought-input" value={input} onChange={e => setInput(e.target.value)} onPaste={onPaste}
            placeholder={activeTopicNode ? `Add to “${activeTopicNode.title}”…` : 'Drop a thought…'} autoComplete="off"
            className="flex-1 bg-transparent text-inherit placeholder-neutral-500 text-[15px] min-w-0 font-medium outline-none px-1" />
          {speechSupported && (
            <button type="button" onClick={toggleVoice} title={listening ? 'Stop voice capture' : 'Speak thoughts'}
              className={'w-9 h-9 rounded-full flex items-center justify-center border ' + (listening
                ? 'mic-live text-neutral-100 bg-neutral-800 border-neutral-500'
                : 'text-neutral-400 bg-neutral-700/30 border-neutral-500/30 hover:text-neutral-200')}>
              <MicIcon size={15} />
            </button>
          )}
          <button type="submit"
            className="w-9 h-9 rounded-full flex items-center justify-center text-white bg-neutral-900 hover:bg-black dark:bg-white dark:text-neutral-900 dark:hover:bg-neutral-100 transition-all shadow-md">
            <SendIcon size={16} />
          </button>
        </div>
        <p className="text-center text-[11px] text-neutral-500/80 mt-2 font-medium">
          Enter to add · ◆ pick a Topic to cluster thoughts · 💬 thread replies · drag 🔗 to link · 📌 pin
        </p>
      </form>

      {/* edit modal */}
      {modalNode && (
        <div data-ui className="absolute inset-0 z-40 flex items-center justify-center bg-black/45"
          onPointerDown={e => { e.stopPropagation(); if (e.target === e.currentTarget) setModalId(null); }}>
          <div className="glass rounded-2xl p-5 w-[min(430px,92vw)]">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-display text-neutral-100 font-semibold">{modalNode.isHub ? 'Edit Meta-Hub' : 'Edit Thought'}</h3>
              <button onClick={() => setModalId(null)} className="text-neutral-400 hover:text-neutral-200"><XIcon size={18} /></button>
            </div>
            <label className="text-[11px] uppercase tracking-wider text-neutral-500">{modalNode.isHub ? 'Title' : 'Thought'}</label>
            <textarea rows="2" value={modalNode.isHub ? modalNode.title : modalNode.text}
              onChange={e => {
                if (modalNode.isHub) { modalNode.title = e.target.value; modalNode.text = e.target.value; }
                else { modalNode.text = e.target.value; modalNode.isQuestion = /\?\s*$/.test(e.target.value); modalNode.r = nodeRadius(modalNode); }
                worldRef.current.updated = Date.now(); bump();
              }}
              className="w-full mt-1 mb-3 bg-neutral-800/60 border border-neutral-600/40 rounded-lg p-2.5 text-neutral-100 text-sm resize-none" />
            <label className="text-[11px] uppercase tracking-wider text-neutral-500">Sub-notes</label>
            <textarea rows="3" value={modalNode.notes} placeholder="Add supporting details…"
              onChange={e => { modalNode.notes = e.target.value; worldRef.current.updated = Date.now(); bump(); }}
              className="w-full mt-1 mb-3 bg-neutral-800/60 border border-neutral-600/40 rounded-lg p-2.5 text-neutral-300 text-sm resize-none" />
            <label className="text-[11px] uppercase tracking-wider text-neutral-500">Color</label>
            <div className="flex gap-2 mt-1.5 mb-4">
              {COLORS.map((c, i) => (
                <button key={i} onClick={() => { modalNode.color = i; worldRef.current.updated = Date.now(); bump(); }}
                  className="w-7 h-7 rounded-full"
                  style={{ background: c.dot, outline: modalNode.color === i ? '2px solid white' : 'none', outlineOffset: 2, opacity: 0.85 }}
                  title={i === 0 ? 'Neutral (default)' : ''} />
              ))}
            </div>
            <div className="flex gap-2 mb-2">
              {!modalNode.isHub && (
                <button onClick={() => expandThought(modalNode)} disabled={expandBusy}
                  className="flex-1 flex items-center justify-center gap-1.5 text-sm text-neutral-100 bg-neutral-800 hover:bg-neutral-700 border border-neutral-600 rounded-lg py-2 disabled:opacity-50">
                  <span className={expandBusy ? 'spin inline-flex' : 'inline-flex'}><SparkIcon size={14} /></span>
                  {expandBusy ? 'Expanding…' : 'Expand ideas'}
                </button>
              )}
              <button onClick={() => { pushUndo(); modalNode.pinned = !modalNode.pinned; modalNode.vx = 0; modalNode.vy = 0; worldRef.current.updated = Date.now(); bump(); }}
                className={'flex-1 flex items-center justify-center gap-1.5 text-sm rounded-lg py-2 border '
                  + (modalNode.pinned ? 'text-amber-300 bg-amber-400/10 border-amber-400/40' : 'text-neutral-300 bg-neutral-700/30 border-neutral-500/30')}>
                <PinIcon size={14} /> {modalNode.pinned ? 'Pinned' : 'Pin'}
              </button>
            </div>
            <button onClick={() => deleteNodes(modalNode.id)}
              className="w-full flex items-center justify-center gap-1.5 text-sm text-red-300 bg-red-500/10 hover:bg-red-500/20 border border-red-400/30 rounded-lg py-2">
              <TrashIcon size={14} /> Delete bubble
            </button>
          </div>
        </div>
      )}

      {/* settings modal */}
      {settingsOpen && (
        <div data-ui className="absolute inset-0 z-40 flex items-center justify-center bg-black/45"
          onPointerDown={e => { e.stopPropagation(); if (e.target === e.currentTarget) setSettingsOpen(false); }}>
          <div className="glass rounded-2xl p-5 w-[min(440px,92vw)]">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-display text-neutral-100 font-semibold">Settings</h3>
              <button onClick={() => setSettingsOpen(false)} className="text-neutral-400 hover:text-neutral-200"><XIcon size={18} /></button>
            </div>
            <label className="text-[11px] uppercase tracking-wider text-neutral-500">Anthropic API key</label>
            <input type="password" defaultValue={apiKey} placeholder="sk-ant-…" autoComplete="off"
              onBlur={e => {
                const k = e.target.value.trim();
                setApiKey(k);
                if (k) localStorage.setItem(LS_APIKEY, k); else localStorage.removeItem(LS_APIKEY);
                lastAIHashRef.current = '';
              }}
              className="w-full mt-1 mb-2 bg-neutral-800/60 border border-neutral-600/40 rounded-lg px-2.5 py-2 text-neutral-100 text-sm" />
            <p className="text-xs text-neutral-500 leading-relaxed mb-3">
              With a key, connections, clusters, and “Expand ideas” use Claude (claude-opus-4-8) for real semantic analysis.
              Without one, a built-in keyword engine runs offline. The key is stored only in this browser and calls go
              directly to Anthropic — usage is billed to your account.
            </p>
            <div className="flex items-center gap-2 text-sm">
              <span className={'w-2 h-2 rounded-full ' + (apiKey ? 'bg-neutral-200' : 'bg-neutral-500')} />
              <span className="text-neutral-300">AI mode: {apiKey ? 'Claude API' : 'Simulated (offline)'}</span>
            </div>
          </div>
        </div>
      )}

      {/* library drawer */}
      <div data-ui className={'drawer absolute top-0 left-0 bottom-0 w-[min(380px,92vw)] z-50 flex flex-col rounded-r-2xl shadow-2xl backdrop-blur-2xl transition-transform duration-300 ' + (drawerOpen ? '' : '-translate-x-full')}
        style={{
          background: theme === 'light' ? 'rgba(255, 255, 255, 0.96)' : 'rgba(18, 18, 18, 0.96)',
          borderRight: `1px solid ${theme === 'light' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.12)'}`,
        }}
        onWheel={e => e.stopPropagation()}
        onPointerDown={e => e.stopPropagation()}>
        
        {/* Header */}
        <div className="flex items-center justify-between p-4 border-b transition-colors"
          style={{ borderColor: theme === 'light' ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.1)' }}>
          <div className="flex items-center gap-2">
            <LibraryIcon size={18} className="text-amber-400" />
            <h2 className="font-display font-semibold text-base text-inherit">Saved Streams</h2>
          </div>
          <div className="flex items-center gap-1.5">
            <button onClick={() => {
              const newW = blankWorld();
              newW.name = "New Project";
              switchWorld(newW);
              setDrawerOpen(false);
            }} 
            title="Create New Project Canvas"
            className="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-neutral-200 border border-neutral-700/60 font-medium transition-colors">
              <PlusIcon size={13} /> Project
            </button>
            <button onClick={() => setDrawerOpen(false)} className="ghost-btn p-1.5 rounded-lg text-inherit hover:bg-neutral-800/50">
              <XIcon size={18} />
            </button>
          </div>
        </div>

        {/* Search Input */}
        <div className="px-3 pt-3 pb-2">
          <div className="relative flex items-center">
            <SearchIcon size={14} className="absolute left-3 text-neutral-500 pointer-events-none" />
            <input
              value={drawerSearch}
              onChange={e => setDrawerSearch(e.target.value)}
              placeholder="Search streams..."
              className="w-full bg-neutral-800/50 border border-neutral-700/50 rounded-xl pl-8 pr-3 py-1.5 text-xs text-neutral-200 placeholder-neutral-500 outline-none focus:border-amber-500/50 transition-colors"
            />
            {drawerSearch && (
              <button onClick={() => setDrawerSearch('')} className="absolute right-2.5 text-neutral-500 hover:text-neutral-300">
                <XIcon size={12} />
              </button>
            )}
          </div>
        </div>

        {/* Segmented Control Tabs */}
        <div className="px-3 pb-2">
          <div className="flex p-1 rounded-xl bg-neutral-800/60 border border-neutral-700/40 text-xs font-medium">
            <button
              onClick={() => setDrawerTab('projects')}
              className={'flex-1 py-1.5 rounded-lg text-center transition-all flex items-center justify-center gap-1.5 ' + 
                (drawerTab === 'projects' 
                  ? 'bg-neutral-700 text-white font-semibold shadow-sm border border-neutral-600/60' 
                  : 'text-neutral-400 hover:text-neutral-200')}
            >
              <span>📁</span>
              <span>Projects</span>
              <span className="text-[10px] opacity-70 px-1.5 py-0.2 rounded-full bg-neutral-900/50">
                {sessionList.filter(s => !(s.name === "Today's Stream" || s.name.startsWith("Stream - ") || s.name.startsWith("Stream:"))).length}
              </span>
            </button>

            <button
              onClick={() => setDrawerTab('daily')}
              className={'flex-1 py-1.5 rounded-lg text-center transition-all flex items-center justify-center gap-1.5 ' + 
                (drawerTab === 'daily' 
                  ? 'bg-neutral-700 text-white font-semibold shadow-sm border border-neutral-600/60' 
                  : 'text-neutral-400 hover:text-neutral-200')}
            >
              <span>📅</span>
              <span>Daily Streams</span>
              <span className="text-[10px] opacity-70 px-1.5 py-0.2 rounded-full bg-neutral-900/50">
                {sessionList.filter(s => (s.name === "Today's Stream" || s.name.startsWith("Stream - ") || s.name.startsWith("Stream:"))).length}
              </span>
            </button>
          </div>
        </div>

        {/* Streams List */}
        <div className="flex-1 overflow-y-auto p-3 space-y-2" key={sessionsRev}>
          {(() => {
            const isDailyCategory = (name) => name === "Today's Stream" || name.startsWith("Stream - ") || name.startsWith("Stream:");
            
            const filteredSessions = sessionList.filter(s => {
              const matchesTab = drawerTab === 'daily' ? isDailyCategory(s.name) : !isDailyCategory(s.name);
              const matchesSearch = !drawerSearch.trim() || s.name.toLowerCase().includes(drawerSearch.toLowerCase().trim());
              return matchesTab && matchesSearch;
            });

            if (!filteredSessions.length) {
              return (
                <div className="text-center py-10 px-4">
                  <span className="text-2xl block mb-2 opacity-50">{drawerTab === 'daily' ? '📅' : '📁'}</span>
                  <p className="text-xs text-neutral-400 font-medium whitespace-pre-line">
                    {drawerSearch 
                      ? `No streams found matching "${drawerSearch}"`
                      : drawerTab === 'daily' 
                        ? 'No archived daily streams yet.\nDaily streams auto-archive at midnight.'
                        : 'No project canvases yet.\nClick "+ Project" to create one.'}
                  </p>
                </div>
              );
            }

            return filteredSessions.map(s => {
              const isCurrent = s.id === w.id;
              const thoughtCount = (s.nodes || []).filter(n => !n.isHub).length;
              const formattedDate = new Date(s.updated).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

              return (
                <div key={s.id}
                  className={'group rounded-xl p-3 border transition-all duration-150 relative ' +
                    (isCurrent
                      ? 'bg-neutral-800/90 border-amber-500/50 shadow-lg ring-1 ring-amber-500/30'
                      : 'bg-neutral-900/40 hover:bg-neutral-800/50 border-neutral-800 hover:border-neutral-700/60')}
                >
                  <div className="flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2 min-w-0 flex-1">
                      {isCurrent ? (
                        <span className="w-2 h-2 rounded-full bg-emerald-400 shrink-0 shadow-[0_0_8px_rgba(52,211,153,0.8)]" title="Currently Active" />
                      ) : (
                        <span className="text-xs shrink-0 opacity-60">{drawerTab === 'daily' ? '📅' : '📁'}</span>
                      )}
                      
                      <input defaultValue={s.name}
                        onBlur={e => renameSession(s.id, e.target.value.trim() || (drawerTab === 'daily' ? "Today's Stream" : "Untitled Project"))}
                        onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                        className="w-full bg-transparent text-xs font-semibold border-b border-transparent focus:border-neutral-500 outline-none truncate"
                        style={{ color: isCurrent ? '#FFFFFF' : '#EAEAEA' }}
                        spellCheck="false" 
                      />
                    </div>

                    <span className="text-[10px] text-neutral-500 shrink-0 font-medium">{formattedDate}</span>
                  </div>

                  <div className="flex items-center justify-between mt-2 pt-2 border-t border-neutral-800/60">
                    <span className="text-[11px] text-neutral-400 font-medium flex items-center gap-1">
                      <span className="text-neutral-500">{thoughtCount}</span> thoughts
                    </span>

                    <div className="flex items-center gap-1 opacity-95 sm:opacity-75 group-hover:opacity-100 transition-opacity">
                      {!isCurrent && (
                        <button onClick={() => openSession(s.id)} title="Open Stream"
                          className="text-[11px] px-2.5 py-1 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 font-medium transition-colors">
                          Open
                        </button>
                      )}
                      
                      <button onClick={() => duplicateSession(s.id)} title="Duplicate Canvas"
                        className="p-1.5 rounded-lg bg-neutral-800/80 hover:bg-neutral-700 text-neutral-300 border border-neutral-700/50 transition-colors">
                        <CopyIcon size={12} />
                      </button>

                      <button onClick={() => deleteSession(s.id)} title="Delete Canvas"
                        className="p-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 transition-colors">
                        <TrashIcon size={12} />
                      </button>
                    </div>
                  </div>
                </div>
              );
            });
          })()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
