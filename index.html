<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>ThoughtStream — Fluid AI Canvas</title>
<!-- Fully offline: all libraries and fonts are vendored locally in ./vendor (no internet needed) -->
<link href="vendor/fonts.css" rel="stylesheet" />
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="vendor/tailwind.js"></script>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0b1120; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  * { -webkit-tap-highlight-color: transparent; }
  .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  #bg-grad {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 120% 90% at 50% 35%, #131c31 0%, #0d1526 55%, #0a0f1d 100%);
  }
  #bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(148,163,184,0.10) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .bubble { position: absolute; left: 0; top: 0; cursor: grab; user-select: none; touch-action: none; will-change: transform; }
  .bubble:active { cursor: grabbing; }
  .bubble-core {
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 2px 6px rgba(0,0,0,0.35), 0 12px 32px rgba(0,0,0,0.25);
    transition: transform 0.18s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.18s ease;
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .bubble:hover .bubble-core {
    transform: scale(1.025);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 4px 10px rgba(0,0,0,0.4), 0 18px 44px rgba(0,0,0,0.35);
  }
  @keyframes pop-in { from { opacity: 0; scale: 0.4; } to { opacity: 1; scale: 1; } }
  .hub-glow { box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 22px rgba(34,211,238,0.28), 0 0 64px rgba(34,211,238,0.10), 0 12px 32px rgba(0,0,0,0.3) !important; }
  .sugg-path { stroke-dasharray: 3 9; animation: dash-flow 1.5s linear infinite; }
  @keyframes dash-flow { to { stroke-dashoffset: -24; } }
  .link-path { animation: link-born 0.8s ease-out; }
  @keyframes link-born { 0% { stroke-width: 5; stroke-opacity: 1; } 100% { stroke-width: 2; } }
  .sugg-badge { animation: badge-pulse 1.7s ease-in-out infinite; }
  @keyframes badge-pulse { 0%,100% { box-shadow: 0 0 6px rgba(34,211,238,0.45); } 50% { box-shadow: 0 0 16px rgba(34,211,238,0.9); } }
  .link-handle { opacity: 0; transition: opacity 0.15s; }
  .bubble:hover .link-handle, .bubble:hover .hub-toggle { opacity: 1; }
  .hub-toggle { opacity: 0; transition: opacity 0.15s; }
  .glass { background: rgba(13,21,38,0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(148,163,184,0.16); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 32px rgba(0,0,0,0.45); }
  .ghost-btn { transition: background 0.15s, color 0.15s; }
  .ghost-btn:hover { background: rgba(148,163,184,0.12); }
  .drawer { transition: transform 0.25s ease; }
  .input-glow:focus-within { border-color: rgba(34,211,238,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 40px rgba(0,0,0,0.45), 0 0 0 3px rgba(34,211,238,0.12); }
  .mic-live { animation: mic-pulse 1.2s ease-in-out infinite; }
  @keyframes mic-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 7px rgba(239,68,68,0); } }
  .target-ring { animation: ring-pulse 1.5s ease-in-out infinite; }
  @keyframes ring-pulse {
    0%, 100% { outline: 2px solid rgba(34,211,238,0.85); outline-offset: 3px; }
    50% { outline: 3px solid rgba(34,211,238,0.30); outline-offset: 7px; }
  }
  .burst span { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 9999px; animation: burst-fly 0.7s cubic-bezier(0.2,0.8,0.4,1) forwards; }
  @keyframes burst-fly { from { opacity: 1; transform: translate(0,0) scale(1); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); } }
  .burst.pop { animation: pop-ring 0.5s ease-out forwards; }
  @keyframes pop-ring { 0% { opacity: 0.9; transform: scale(0.2); } 100% { opacity: 0; transform: scale(2.4); } }
  .pinned-core { box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0 1px rgba(251,191,36,0.35), 0 8px 24px rgba(0,0,0,0.35) !important; }
  .topic-glow { box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 22px rgba(129,140,248,0.30), 0 0 60px rgba(129,140,248,0.12), 0 12px 32px rgba(0,0,0,0.3) !important; }
  .topic-zone { position: absolute; left: 0; top: 0; border-radius: 9999px; pointer-events: none; will-change: transform; transition: opacity 0.3s; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.22); border-radius: 4px; }
  input, textarea { outline: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  window.addEventListener('error', (e) => console.error('UNCAUGHT:', e.message, e.filename ? '' : '', e.lineno || ''));
  window.addEventListener('unhandledrejection', (e) => console.error('UNHANDLED PROMISE:', e.reason && e.reason.message));
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
  });
</script>
<script type="text/babel" data-presets="react-classic">
const { useState, useRef, useEffect, useCallback } = React;

/* ---------- utilities ---------- */
const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const ACCENT = '#22d3ee';
const TOPIC_ACCENT = '#818cf8';

/* index 0 = neutral default; others are user-assignable */
const COLORS = [
  { bg: 'rgba(30,41,59,0.55)',    border: 'rgba(148,163,184,0.28)', text: '#e2e8f0', dot: '#64748b' },
  { bg: 'rgba(34,211,238,0.10)',  border: 'rgba(34,211,238,0.38)',  text: '#cffafe', dot: '#22d3ee' },
  { bg: 'rgba(129,140,248,0.10)', border: 'rgba(129,140,248,0.38)', text: '#e0e7ff', dot: '#818cf8' },
  { bg: 'rgba(244,114,182,0.10)', border: 'rgba(244,114,182,0.38)', text: '#fce7f3', dot: '#f472b6' },
  { bg: 'rgba(251,191,36,0.10)',  border: 'rgba(251,191,36,0.38)',  text: '#fef3c7', dot: '#fbbf24' },
  { bg: 'rgba(52,211,153,0.10)',  border: 'rgba(52,211,153,0.38)',  text: '#d1fae5', dot: '#34d399' },
];

/* ---------- simulated AI knowledge (fallback when no API key) ---------- */
const CATEGORIES = {
  'Marketing':          ['marketing','ads','advertising','seo','social','brand','branding','campaign','content','audience','promotion','influencer','newsletter','outreach'],
  'Revenue & Pricing':  ['revenue','pricing','price','subscription','monetize','monetization','sales','profit','paid','billing','freemium','tier','upsell','money'],
  'Product':            ['product','feature','features','mvp','prototype','roadmap','app','tool','integration','plugin'],
  'Launch & Timeline':  ['launch','timeline','deadline','schedule','ship','shipping','release','milestone','beta','sprint','quarter'],
  'Team & Hiring':      ['team','hire','hiring','recruit','founder','cofounder','engineer','designer','staff','culture','contractor'],
  'Technology':         ['api','backend','frontend','database','ai','llm','ml','cloud','infrastructure','stack','code','tech','automation'],
  'Users & Customers':  ['user','users','customer','customers','feedback','onboarding','retention','churn','community','support','persona'],
  'Growth':             ['growth','scale','scaling','viral','referral','referrals','acquisition','funnel','conversion','metrics','kpi','partnership'],
  'Design':             ['design','ui','ux','visual','layout','logo','style','aesthetic','wireframe'],
  'Risks & Challenges': ['risk','risks','competitor','competitors','challenge','problem','threat','legal','cost','costs','budget','burnout'],
};
const STOP = new Set(('the a an and or but if then of to in on for with we our is are be it this that i my me at as by from about into '
  + 'should could would can will need needs more less get make makes use using have has had do does did how what when where why who '
  + 'maybe also just really think thing things idea ideas new some every want wants like lets let go going lot very much so not no yes '
  + 'up out over under after before there here they them their you your one two too all any way ways good great big small pro con').split(' '));

const keywords = (text) => {
  const seen = new Set();
  return text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
    .filter(w => w.length > 2 && !STOP.has(w) && !seen.has(w) && seen.add(w));
};

/* ---------- persistence ---------- */
const LS_SESSIONS = 'thoughtstream_sessions';
const LS_CURRENT = 'thoughtstream_current';
const LS_APIKEY = 'thoughtstream_api_key';
const loadStore = () => { try { return JSON.parse(localStorage.getItem(LS_SESSIONS)) || {}; } catch { return {}; } };
const saveStore = (s) => localStorage.setItem(LS_SESSIONS, JSON.stringify(s));

const blankWorld = () => ({
  id: uid(), name: 'Untitled Stream', nodes: [], links: [], suggestions: [], rejected: [], updated: Date.now(),
});

/* ---------- icons (lucide paths, inlined) ---------- */
const Icon = ({ d, size = 16, ...p }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>{d}</svg>
);
const SendIcon    = (p) => <Icon {...p} d={<><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></>} />;
const PlusIcon    = (p) => <Icon {...p} d={<><path d="M5 12h14"/><path d="M12 5v14"/></>} />;
const MinusIcon   = (p) => <Icon {...p} d={<path d="M5 12h14"/>} />;
const LibraryIcon = (p) => <Icon {...p} d={<><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></>} />;
const XIcon       = (p) => <Icon {...p} d={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />;
const TrashIcon   = (p) => <Icon {...p} d={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></>} />;
const LinkIcon    = (p) => <Icon {...p} d={<><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></>} />;
const CopyIcon    = (p) => <Icon {...p} d={<><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>} />;
const SparkIcon   = (p) => <Icon {...p} d={<path d="M9.94 14.34 8 22l-2-6-6-2 7.66-1.94a2 2 0 0 0 1.4-1.4L11 3l1.94 7.66a2 2 0 0 0 1.4 1.4L22 14l-7.66 1.94a2 2 0 0 0-1.4 1.4Z"/>} />;
const CheckIcon   = (p) => <Icon {...p} d={<path d="M20 6 9 17l-5-5"/>} />;
const UndoIcon    = (p) => <Icon {...p} d={<><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></>} />;
const RedoIcon    = (p) => <Icon {...p} d={<><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></>} />;
const FitIcon     = (p) => <Icon {...p} d={<><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></>} />;
const SearchIcon  = (p) => <Icon {...p} d={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />;
const MicIcon     = (p) => <Icon {...p} d={<><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></>} />;
const PlayIcon    = (p) => <Icon {...p} d={<polygon points="6 3 20 12 6 21 6 3"/>} />;
const GearIcon    = (p) => <Icon {...p} d={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />;
const DownloadIcon= (p) => <Icon {...p} d={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>} />;
const FoldIcon    = (p) => <Icon {...p} d={<path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>} />;
const UnfoldIcon  = (p) => <Icon {...p} d={<path d="m7 20 5-5 5 5M7 4l5 5 5-5"/>} />;
const ZapIcon     = (p) => <Icon {...p} d={<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>} />;
const PinIcon     = (p) => <Icon {...p} d={<><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></>} />;
const MsgIcon     = (p) => <Icon {...p} d={<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>} />;

/* ---------- sizing ---------- */
const nodeRadius = (n) => n.isHub ? 84 : n.isTopic ? 74 : clamp(34 + Math.min(n.text.length, 90) * 1.15, 42, 128);

/* ---------- serialization for undo + storage ---------- */
const pickNode = ({ id, text, notes, color, x, y, isHub, title, created, collapsed, isQuestion, pinned, isTopic, topicId }) =>
  ({ id, text, notes, color, x: Math.round(x), y: Math.round(y), isHub, title, created, collapsed, isQuestion, pinned, isTopic, topicId });
const serializeWorld = (w) => JSON.stringify({ nodes: w.nodes.map(pickNode), links: w.links, rejected: w.rejected });
const hydrateNode = (n, i) => ({
  notes: '', color: 0, title: undefined, collapsed: false, isQuestion: false, pinned: false, isTopic: false, topicId: null, ...n,
  created: n.created || i, vx: 0, vy: 0, floating: false, r: 0,
});

/* ---------- starter templates ---------- */
const TEMPLATES = {
  'SWOT analysis': [
    'Strength: what do we do better than anyone?',
    'Weakness: where are we most exposed?',
    'Opportunity: what trend could we ride?',
    'Threat: which competitor move worries us?',
  ],
  'How might we…': [
    'How might we delight first-time users?',
    'How might we double word-of-mouth growth?',
    'How might we cut onboarding to one step?',
  ],
  'Pros & cons': [
    'Pro: the strongest argument in favor',
    'Con: the biggest risk or cost',
    'Pro: a second-order benefit',
    'Con: what could go wrong long-term?',
  ],
};

function App() {
  const [, setRev] = useState(0);
  const bump = useCallback(() => setRev(r => r + 1), []);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [modalId, setModalId] = useState(null);
  const [activeSugg, setActiveSugg] = useState(null);
  const [activeLink, setActiveLink] = useState(null);
  const [linkFrom, setLinkFrom] = useState(null);
  const [input, setInput] = useState('');
  const [sessionsRev, setSessionsRev] = useState(0);
  const [query, setQuery] = useState('');
  const [selIds, setSelIds] = useState(() => new Set());
  const [marquee, setMarquee] = useState(null);
  const [replayIdx, setReplayIdx] = useState(null);
  const [listening, setListening] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [exportOpen, setExportOpen] = useState(false);
  const [aiBusy, setAiBusy] = useState(false);
  const [aiNote, setAiNote] = useState('');
  const [expandBusy, setExpandBusy] = useState(false);
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(LS_APIKEY) || '');
  const [targetId, setTargetId] = useState(null);
  const [pureDump, setPureDump] = useState(false);
  const [activeTopic, setActiveTopic] = useState(null);
  const [topicMenuOpen, setTopicMenuOpen] = useState(false);
  const [newTopicName, setNewTopicName] = useState('');

  const worldRef = useRef(null);
  if (!worldRef.current) {
    const store = loadStore();
    const cur = localStorage.getItem(LS_CURRENT);
    if (cur && store[cur]) {
      const s = store[cur];
      worldRef.current = { ...blankWorld(), ...s, suggestions: [], rejected: s.rejected || [] };
      worldRef.current.nodes = worldRef.current.nodes.map(hydrateNode);
      worldRef.current.nodes.forEach(n => { n.r = nodeRadius(n); });
    } else {
      worldRef.current = blankWorld();
    }
  }

  const viewRef = useRef({ x: 0, y: 0, s: 1 });
  const containerRef = useRef(null);
  const worldElRef = useRef(null);
  const bgRef = useRef(null);
  const nodeEls = useRef({});
  const pathEls = useRef({});
  const hitEls = useRef({});
  const labelEls = useRef({});
  const badgeEls = useRef({});
  const suggCardRef = useRef(null);
  const linkCardRef = useRef(null);
  const previewRef = useRef(null);
  const mouseRef = useRef({ x: 0, y: 0 });
  const dragRef = useRef(null);
  const panRef = useRef(null);
  const marqueeStartRef = useRef(null);
  const linkFromRef = useRef(null);
  const linkDragRef = useRef(null);
  const activeSuggRef = useRef(null);
  const activeLinkRef = useRef(null);
  const selRef = useRef(selIds);
  const queryRef = useRef('');
  const replayRef = useRef(null);
  const targetRef = useRef(null);
  const pureDumpRef = useRef(false);
  const activeTopicRef = useRef(null);
  const zoneEls = useRef({});
  const threadLineRef = useRef(null);
  const apiKeyRef = useRef(apiKey);
  const aiBusyRef = useRef(false);
  const lastAIHashRef = useRef('');
  const undoStack = useRef([]);
  const redoStack = useRef([]);
  const recRef = useRef(null);
  useEffect(() => { linkFromRef.current = linkFrom; }, [linkFrom]);
  useEffect(() => { activeSuggRef.current = activeSugg; }, [activeSugg]);
  useEffect(() => { activeLinkRef.current = activeLink; }, [activeLink]);
  useEffect(() => { selRef.current = selIds; }, [selIds]);
  useEffect(() => { queryRef.current = query.trim().toLowerCase(); }, [query]);
  useEffect(() => { replayRef.current = replayIdx; }, [replayIdx]);
  useEffect(() => { apiKeyRef.current = apiKey; }, [apiKey]);
  useEffect(() => { targetRef.current = targetId; }, [targetId]);
  useEffect(() => { pureDumpRef.current = pureDump; }, [pureDump]);
  useEffect(() => { activeTopicRef.current = activeTopic; }, [activeTopic]);

  const screenToWorld = (sx, sy) => {
    const v = viewRef.current;
    return { x: (sx - v.x) / v.s, y: (sy - v.y) / v.s };
  };
  const byId = (id) => worldRef.current.nodes.find(n => n.id === id);

  /* ---------- undo / redo ---------- */
  const pushUndo = useCallback(() => {
    undoStack.current.push(serializeWorld(worldRef.current));
    if (undoStack.current.length > 60) undoStack.current.shift();
    redoStack.current = [];
  }, []);
  const restoreSnapshot = (snap) => {
    const data = JSON.parse(snap);
    const w = worldRef.current;
    w.nodes = data.nodes.map(hydrateNode);
    w.nodes.forEach(n => { n.r = nodeRadius(n); });
    w.links = data.links;
    w.rejected = data.rejected;
    w.suggestions = [];
    w.updated = Date.now();
    setModalId(null); setActiveSugg(null); setActiveLink(null); setSelIds(new Set()); setTargetId(null);
    bump();
  };
  const undo = useCallback(() => {
    if (!undoStack.current.length) return;
    redoStack.current.push(serializeWorld(worldRef.current));
    restoreSnapshot(undoStack.current.pop());
  }, []);
  const redo = useCallback(() => {
    if (!redoStack.current.length) return;
    undoStack.current.push(serializeWorld(worldRef.current));
    restoreSnapshot(redoStack.current.pop());
  }, []);

  /* ---------- particle bursts ---------- */
  const spawnBurst = useCallback((x, y, opts = {}) => {
    const w = worldRef.current;
    if (!w.bursts) w.bursts = [];
    const burstId = uid();
    w.bursts.push({ id: burstId, x, y, ...opts });
    setTimeout(() => {
      const w2 = worldRef.current;
      w2.bursts = (w2.bursts || []).filter(b => b.id !== burstId);
      bump();
    }, opts.big ? 700 : 700);
    bump();
  }, []);

  /* ---------- topics (manual gravity clusters, no links) ---------- */
  const createTopic = useCallback((name) => {
    name = (name || '').trim();

    cv.toBlob(b => download(`${w.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.png`, b), 'image/png');
    setExportOpen(false);
  };

  /* ---------- zoom ---------- */
  const zoomBy = (factor) => {
    const v = viewRef.current;
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    const ns = clamp(v.s * factor, 0.3, 2.5);
    v.x = cx - (cx - v.x) * (ns / v.s);
    v.y = cy - (cy - v.y) * (ns / v.s);
    v.s = ns;
  };
  const zoomToFit = () => {
    const hidden = hiddenIdSet();
    const nodes = worldRef.current.nodes.filter(n => !hidden.has(n.id));
    if (!nodes.length) return;
    const pad = 120;
    const minX = Math.min(...nodes.map(n => n.x - n.r)) - pad;
    const maxX = Math.max(...nodes.map(n => n.x + n.r)) + pad;
    const minY = Math.min(...nodes.map(n => n.y - n.r)) - pad - 70;
    const maxY = Math.max(...nodes.map(n => n.y + n.r)) + pad + 90;
    const s = clamp(Math.min(window.innerWidth / (maxX - minX), window.innerHeight / (maxY - minY)), 0.3, 1.4);
    const v = viewRef.current;
    v.s = s;
    v.x = window.innerWidth / 2 - ((minX + maxX) / 2) * s;
    v.y = window.innerHeight / 2 - ((minY + maxY) / 2) * s;
  };

  /* ---------- voice capture ---------- */
  const speechSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const toggleVoice = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    if (listening) { recRef.current && recRef.current.stop(); setListening(false); return; }
    const r = new SR();
    r.continuous = true;
    r.interimResults = false;
    r.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          const t = e.results[i][0].transcript.trim();
          if (t) addThought(t);
        }
      }
    };
    r.onend = () => setListening(false);
    r.onerror = () => setListening(false);
    r.start();
    recRef.current = r;
    setListening(true);
  };

  /* ---------- physics + paint loop ---------- */
  useEffect(() => {
    let raf;
    let lastTick = 0;
    const doTick = () => {
      lastTick = performance.now();
      const w = worldRef.current, v = viewRef.current;
      const nodes = w.nodes;
      const hidden = hiddenIdSet();
      const q = queryRef.current;
      const held = (n) => dragRef.current && dragRef.current.group.some(g => g.n === n);
      const fixed = (n) => n.pinned || held(n); // fixed = won't move on its own

      for (const n of nodes) {
        if (hidden.has(n.id)) continue;
        if (fixed(n)) { n.vx = 0; n.vy = 0; continue; }
        if (n.floating) {
          n.vy += (-2.6 - n.vy) * 0.07;
          n.vx *= 0.985;
          if (n.y <= n.targetY) { n.floating = false; n.vy *= 0.2; }
        } else {
          n.vx += (Math.random() - 0.5) * 0.03;
          n.vy += (Math.random() - 0.5) * 0.03;
        }
      }
      for (let i = 0; i < nodes.length; i++) {
        if (hidden.has(nodes[i].id)) continue;
        for (let j = i + 1; j < nodes.length; j++) {
          if (hidden.has(nodes[j].id)) continue;
          const a = nodes[i], b = nodes[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.01;
          const min = a.r + b.r * 0.9 + 12;
          if (d < min) {
            const f = ((min - d) / min) * 1.4;
            dx /= d; dy /= d;
            if (!fixed(a)) { a.vx -= dx * f; a.vy -= dy * f; }
            if (!fixed(b)) { b.vx += dx * f; b.vy += dy * f; }
          }
        }
      }
      for (const l of w.links) {
        const a = byId(l.a), b = byId(l.b);
        if (!a || !b || hidden.has(a.id) || hidden.has(b.id)) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const rest = a.r + b.r + 70;
        const f = (d - rest) * 0.002;
        dx /= d; dy /= d;
        if (!fixed(a)) { a.vx += dx * f * d * 0.02; a.vy += dy * f * d * 0.02; }
        if (!fixed(b)) { b.vx -= dx * f * d * 0.02; b.vy -= dy * f * d * 0.02; }
      }
      // topic gravity: pull members loosely into orbit around their topic (no link, topic stays put)
      for (const n of nodes) {
        if (!n.topicId || hidden.has(n.id) || fixed(n)) continue;
        const t = byId(n.topicId);
        if (!t || t.id === n.id || hidden.has(t.id)) continue;
        let dx = t.x - n.x, dy = t.y - n.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const orbit = t.r + n.r + 34;
        const f = (d - orbit) * 0.0016; // gentle — weaker than a link spring
        n.vx += (dx / d) * f * d * 0.02;
        n.vy += (dy / d) * f * d * 0.02;
      }
      for (const n of nodes) {
        if (hidden.has(n.id)) continue;
        if (fixed(n)) continue;
        n.vx = clamp(n.vx * 0.9, -9, 9);
        n.vy = clamp(n.vy * 0.9, -9, 9);
        n.x += n.vx; n.y += n.vy;
      }

      /* paint */
      if (worldElRef.current) worldElRef.current.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.s})`;
      if (bgRef.current) {
        bgRef.current.style.backgroundPosition = `${v.x}px ${v.y}px`;
        bgRef.current.style.backgroundSize = `${26 * v.s}px ${26 * v.s}px`;
      }
      const sel = selRef.current;
      for (const n of nodes) {
        const el = nodeEls.current[n.id];
        if (!el) continue;
        el.style.display = hidden.has(n.id) ? 'none' : '';
        el.style.transform = `translate(${n.x}px, ${n.y}px) translate(-50%, -50%)`;
        const match = !q || (n.text + ' ' + (n.notes || '') + ' ' + (n.title || '')).toLowerCase().includes(q);
        el.style.opacity = match ? '1' : '0.14';
      }
      // topic zones: faint halo sized to enclose each topic's gravity members
      for (const n of nodes) {
        if (!n.isTopic) continue;
        const zel = zoneEls.current[n.id];
        if (!zel) continue;
        if (hidden.has(n.id)) { zel.style.display = 'none'; continue; }
        let maxR = n.r + 60;
        for (const m of nodes) {
          if (m.topicId === n.id && !hidden.has(m.id)) {
            maxR = Math.max(maxR, Math.hypot(m.x - n.x, m.y - n.y) + m.r + 22);
          }

        zel.style.display = '';
        zel.style.width = zel.style.height = (maxR * 2) + 'px';
        zel.style.transform = `translate(${n.x}px, ${n.y}px) translate(-50%, -50%)`;
      }
      const curve = (a, b) => {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1;
        const off = Math.min(d * 0.14, 46);
        return `M ${a.x} ${a.y} Q ${mx - dy / d * off} ${my + dx / d * off} ${b.x} ${b.y}`;
      };
      for (const l of w.links) {
        const a = byId(l.a), b = byId(l.b);
        const vis = a && b && !hidden.has(a.id) && !hidden.has(b.id);
        const el = pathEls.current[l.id], hit = hitEls.current[l.id], lab = labelEls.current[l.id];
        if (el) { el.style.display = vis ? '' : 'none'; if (vis) el.setAttribute('d', curve(a, b)); }
        if (hit) { hit.style.display = vis ? '' : 'none'; if (vis) hit.setAttribute('d', curve(a, b)); }
        if (lab) { lab.style.display = vis && l.label ? '' : 'none'; if (vis) lab.style.transform = `translate(${(a.x + b.x) / 2}px, ${(a.y + b.y) / 2 + 10}px) translate(-50%, -50%)`; }
      }
      for (const s of w.suggestions) {
        const a = byId(s.a), b = byId(s.b);
        const vis = a && b && !hidden.has(a.id) && !hidden.has(b.id) && replayRef.current === null && !pureDumpRef.current;
        const el = pathEls.current[s.id], badge = badgeEls.current[s.id];
        if (el) { el.style.display = vis ? '' : 'none'; if (vis) el.setAttribute('d', curve(a, b)); }
        if (badge) { badge.style.display = vis ? '' : 'none'; if (vis) badge.style.transform = `translate(${(a.x + b.x) / 2}px, ${(a.y + b.y) / 2}px) translate(-50%, -50%)`; }
      }
      if (activeSuggRef.current && suggCardRef.current) {
        const s = w.suggestions.find(x => x.id === activeSuggRef.current);
        const a = s && byId(s.a), b = s && byId(s.b);
        if (a && b) suggCardRef.current.style.transform = `translate(${(a.x + b.x) / 2}px, ${(a.y + b.y) / 2 + 26}px) translate(-50%, 0)`;
      }
      if (activeLinkRef.current && linkCardRef.current) {
        const l = w.links.find(x => x.id === activeLinkRef.current);
        const a = l && byId(l.a), b = l && byId(l.b);
        if (a && b) linkCardRef.current.style.transform = `translate(${(a.x + b.x) / 2}px, ${(a.y + b.y) / 2 + 22}px) translate(-50%, 0)`;
      }
      if (previewRef.current) {
        const src = linkFromRef.current && byId(linkFromRef.current);
        if (src) {
          previewRef.current.setAttribute('d', `M ${src.x} ${src.y} L ${mouseRef.current.x} ${mouseRef.current.y}`);
          previewRef.current.style.display = '';
        } else previewRef.current.style.display = 'none';
      }
      if (threadLineRef.current) {
        const t = targetRef.current && byId(targetRef.current);
        if (t && !hidden.has(t.id)) {
          const p = screenToWorld(window.innerWidth / 2, window.innerHeight - 100);
          threadLineRef.current.setAttribute('d', `M ${t.x} ${t.y} L ${p.x} ${p.y}`);
          threadLineRef.current.style.display = '';
        } else threadLineRef.current.style.display = 'none';
      }
    };
    const safeTick = () => { try { doTick(); } catch (e) { console.error('tick:', e.message); lastTick = performance.now(); } };
    const loop = () => { safeTick(); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);

  }, []);

  /* ---------- pan / zoom / drag / marquee ---------- */
  useEffect(() => {
    const el = containerRef.current;
    const onWheel = (e) => {
      e.preventDefault();
      const v = viewRef.current;
      const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.008 : 0.0016));
      const ns = clamp(v.s * factor, 0.3, 2.5);
      v.x = e.clientX - (e.clientX - v.x) * (ns / v.s);
      v.y = e.clientY - (e.clientY - v.y) * (ns / v.s);

    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      mouseRef.current = screenToWorld(e.clientX, e.clientY);

        linkDragRef.current.moved = true;
      }
      if (marqueeStartRef.current) {
        const m = marqueeStartRef.current;
        setMarquee({
          x: Math.min(m.sx, e.clientX), y: Math.min(m.sy, e.clientY),
          w: Math.abs(e.clientX - m.sx), h: Math.abs(e.clientY - m.sy),
        });
        return;
      }
      if (panRef.current) {
        const v = viewRef.current;
        v.x = panRef.current.vx + (e.clientX - panRef.current.sx);
        v.y = panRef.current.vy + (e.clientY - panRef.current.sy);
      }
      if (dragRef.current) {
        const d = dragRef.current;
        const p = screenToWorld(e.clientX, e.clientY);
        for (const g of d.group) {
          g.n.x = p.x - g.offX;
          g.n.y = p.y - g.offY;
          g.n.floating = false;
        }

      }
    };
    const onUp = (e) => {
      // complete a drag-to-link started from a bubble's link handle
      if (linkDragRef.current) {
        const from = linkDragRef.current.from;
        const moved = linkDragRef.current.moved;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const bubbleEl = el && el.closest('[data-bubble][data-id]');

        if (toId && toId !== from) {
          createLink(from, toId);
          setLinkFrom(null);
        } else if (moved) {
          setLinkFrom(null); // dragged onto empty space → cancel
        }
        // pure click (not moved, not on another bubble): leave armed for tap-to-link
        return;
      }
      if (marqueeStartRef.current) {
        const m = marqueeStartRef.current;
        const a = screenToWorld(Math.min(m.sx, e.clientX), Math.min(m.sy, e.clientY));
        const b = screenToWorld(Math.max(m.sx, e.clientX), Math.max(m.sy, e.clientY));
        const inside = worldRef.current.nodes
          .filter(n => n.x >= a.x && n.x <= b.x && n.y >= a.y && n.y <= b.y)
          .map(n => n.id);
        setSelIds(new Set(inside));
        marqueeStartRef.current = null;
        setMarquee(null);
      }
      if (dragRef.current) {
        const d = dragRef.current;
        if (!d.moved) {

          }

        }

      }

    };

  }, []);

    const onKey = (e) => {

  const onBackgroundDown = (e) => {

  const onBubbleDown = (node) => (e) => {

    const groupIds = selRef.current.has(node.id) ? selRef.current : new Set([node.id]);

  const onPaste = (e) => {
    const text = e.clipboardData.getData('text');

      e.preventDefault();
      pushUndo();
      text.split('\n').map(l => l.trim()).filter(Boolean).slice(0, 20)
        .forEach((l, i) => setTimeout(() => addThought(l, { skipUndo: true }), i * 280));
    }
  };
  const seedTemplate = (name) => {
    pushUndo();
    TEMPLATES[name].forEach((t, i) => setTimeout(() => addThought(t, { skipUndo: true }), i * 320));
  };

  const w = worldRef.current;
  const modalNode = modalId && byId(modalId);
  const targetNode = targetId && byId(targetId);
  const topics = w.nodes.filter(n => n.isTopic);
  const activeTopicNode = activeTopic && byId(activeTopic);
  const suggCard = activeSugg && w.suggestions.find(s => s.id === activeSugg);
  const linkCard = activeLink && w.links.find(l => l.id === activeLink);
  const store = loadStore();
  const sessionList = Object.values(store).sort((a, b) => b.updated - a.updated);
  const replaying = replayIdx !== null;

  return (
    <div ref={containerRef} className="fixed inset-0 select-none" onPointerDown={onBackgroundDown}>
      <div id="bg-grad" />
      <div id="bg-dots" ref={bgRef} />

      {/* world layer */}
      <div ref={worldElRef} className="absolute inset-0" style={{ transformOrigin: '0 0' }}>
        {/* topic gravity zones (behind everything) */}
        {w.nodes.filter(n => n.isTopic).map(n => (
          <div key={'zone' + n.id} className="topic-zone" ref={el => { if (el) zoneEls.current[n.id] = el; }}
            style={{ background: 'radial-gradient(circle, rgba(129,140,248,0.09) 0%, rgba(129,140,248,0.05) 55%, transparent 72%)',
              border: '1px solid rgba(129,140,248,0.14)', display: 'none' }} />
        ))}
        <svg className="absolute" style={{ overflow: 'visible', width: 1, height: 1 }}>
          {w.links.map(l => (
            <g key={l.id}>
              <path ref={el => { if (el) pathEls.current[l.id] = el; }}
                className="link-path" fill="none" stroke="rgba(148,210,235,0.5)" strokeWidth="2" strokeLinecap="round" />
              <path ref={el => { if (el) hitEls.current[l.id] = el; }}
                fill="none" stroke="transparent" strokeWidth="20" style={{ pointerEvents: 'stroke', cursor: 'pointer' }}
                onPointerDown={e => e.stopPropagation()}
                onClick={e => { e.stopPropagation(); setActiveLink(activeLink === l.id ? null : l.id); setActiveSugg(null); }} />
            </g>

          {w.suggestions.map(s => (
            <path key={s.id} ref={el => { if (el) pathEls.current[s.id] = el; }}
              className="sugg-path" fill="none" stroke="rgba(34,211,238,0.28)" strokeWidth="1" strokeLinecap="round" />

            strokeDasharray="5 5" style={{ display: 'none', pointerEvents: 'none' }} />
          <path ref={threadLineRef} fill="none" stroke="rgba(34,211,238,0.32)" strokeWidth="1.5"

        </svg>

        {(w.bursts || []).map(b => {

                className="flex-1 flex items-center justify-center gap-1 bg-cyan-500/20 hover:bg-cyan-500/35 border border-cyan-400/50 text-cyan-100 text-xs font-medium rounded-lg py-1.5">
                <CheckIcon size={13} /> Accept
              </button>
              <button onClick={() => rejectSugg(suggCard)}
                className="flex-1 flex items-center justify-center gap-1 bg-slate-700/40 hover:bg-slate-600/50 border border-slate-500/40 text-slate-300 text-xs font-medium rounded-lg py-1.5">
                <XIcon size={13} /> Reject
              </button>
            </div>
          </div>
        )}

        {/* link edit card */}
        {linkCard && (
          <div data-ui ref={linkCardRef} onPointerDown={e => e.stopPropagation()}
            className="glass absolute left-0 top-0 rounded-xl p-3 w-56 z-20 will-change-transform">
            <div className="text-[11px] uppercase tracking-wider text-slate-500 mb-1">Connection label</div>
            <input defaultValue={linkCard.label || ''} placeholder="e.g. depends on…" autoFocus
              onChange={e => { linkCard.label = e.target.value; worldRef.current.updated = Date.now(); }}
              onBlur={bump} onKeyDown={e => e.key === 'Enter' && (bump(), setActiveLink(null))}
              className="w-full bg-slate-800/60 border border-slate-600/40 rounded-lg px-2.5 py-1.5 text-slate-100 text-sm mb-2" />
            <div className="flex gap-2">
              <button onClick={() => { bump(); setActiveLink(null); }}
                className="flex-1 text-xs bg-cyan-500/20 hover:bg-cyan-500/35 border border-cyan-400/50 text-cyan-100 rounded-lg py-1.5">Done</button>
              <button onClick={() => unlink(linkCard.id)}
                className="flex-1 text-xs bg-red-500/10 hover:bg-red-500/25 border border-red-400/30 text-red-300 rounded-lg py-1.5">Unlink</button>
            </div>
          </div>
        )}

        {/* bubbles */}
        {w.nodes.map(n => {
          const c = COLORS[n.color % COLORS.length];
          const isSource = linkFrom === n.id;
          const isSel = selIds.has(n.id);
          const memberCount = n.isHub ? hubMembers(n.id).length : 0;
          return (
            <div key={n.id} data-bubble data-id={n.id}
              ref={el => { if (el) nodeEls.current[n.id] = el; }}
              onPointerDown={onBubbleDown(n)}
              onDoubleClick={e => { e.stopPropagation(); setModalId(n.id); }}
              className="bubble">
              <div className={'bubble-core relative rounded-full flex flex-col items-center justify-center text-center px-5 py-3 '
                  + (n.isHub ? 'hub-glow' : '') + (n.isTopic ? 'topic-glow' : '') + (n.pinned ? ' pinned-core' : '') + (targetId === n.id ? ' target-ring' : '')}
                style={{
                  background: n.isHub ? 'rgba(11,36,52,0.62)' : n.isTopic ? 'rgba(28,26,60,0.66)'
                    : (n.topicId && n.color === 0 ? 'rgba(129,140,248,0.08)' : c.bg),
                  border: n.isHub
                    ? '1.5px solid rgba(34,211,238,0.6)'
                    : n.isTopic
                    ? `1.5px solid ${isSel || targetId === n.id ? ACCENT : 'rgba(129,140,248,0.6)'}`
                    : `1px solid ${isSource || isSel || targetId === n.id ? ACCENT : (n.topicId && n.color === 0 ? 'rgba(129,140,248,0.4)' : c.border)}`,
                  color: n.isHub ? '#a5f3fc' : n.isTopic ? '#c7d2fe' : c.text,
                  maxWidth: n.isHub ? 260 : n.isTopic ? 240 : 230,
                  minWidth: n.isHub || n.isTopic ? 170 : 0,
                  ...(isSel ? { outline: `2px solid ${ACCENT}`, outlineOffset: 3 } : {}),
                }}>
                {n.isHub && (
                  <span className="flex items-center gap-1 text-[10px] uppercase tracking-widest text-cyan-400/80 mb-0.5">
                    <SparkIcon size={11} /> Meta-Hub{n.collapsed ? ` · ${memberCount}` : ''}
                  </span>
                )}
                {n.isTopic && (
                  <span className="text-[10px] uppercase tracking-widest mb-0.5" style={{ color: 'rgba(165,180,252,0.8)' }}>
                    ◆ Topic{activeTopic === n.id ? ' · active' : ''}
                  </span>
                )}
                <span className={n.isHub || n.isTopic ? 'font-display font-bold text-lg leading-tight' : 'text-[13.5px] leading-snug font-normal'}
                  style={{ wordBreak: 'break-word' }}>
                  {n.isHub || n.isTopic ? n.title : n.text}
                </span>
                {!n.isHub && n.notes && <span className="mt-1 w-1.5 h-1.5 rounded-full" style={{ background: c.dot === '#64748b' ? ACCENT : c.dot }} title="Has notes" />}
                <button data-ui
                  onPointerDown={e => {
                    e.stopPropagation(); e.preventDefault();
                    setLinkFrom(n.id);
                    linkDragRef.current = { from: n.id, moved: false, sx: e.clientX, sy: e.clientY };
                  }}
                  className="link-handle absolute -top-2 -right-2 w-7 h-7 rounded-full flex items-center justify-center text-cyan-200"
                  style={{ background: 'rgba(8,47,63,0.95)', border: '1px solid rgba(34,211,238,0.55)', opacity: isSource ? 1 : undefined, touchAction: 'none' }}
                  title={isSource ? 'Drag to a bubble to link · click again to cancel' : 'Drag to another bubble to link'}>
                  <LinkIcon size={13} />
                </button>
                <button data-ui
                  onPointerDown={e => e.stopPropagation()}
                  onClick={e => { e.stopPropagation(); pushUndo(); n.pinned = !n.pinned; n.vx = 0; n.vy = 0; worldRef.current.updated = Date.now(); bump(); }}
                  className={'link-handle absolute -bottom-2 -right-2 w-7 h-7 rounded-full flex items-center justify-center '
                    + (n.pinned ? 'text-amber-300' : 'text-slate-300')}
                  style={{ background: n.pinned ? 'rgba(60,45,10,0.95)' : 'rgba(30,41,59,0.95)', border: '1px solid ' + (n.pinned ? 'rgba(251,191,36,0.6)' : 'rgba(148,163,184,0.4)'), opacity: n.pinned ? 1 : undefined, touchAction: 'none' }}
                  title={n.pinned ? 'Unpin — let it drift again' : 'Pin in place — others get pulled toward it'}>
                  <PinIcon size={12} />
                </button>
                <button data-ui
                  onPointerDown={e => e.stopPropagation()}
                  onClick={e => { e.stopPropagation(); setTargetId(targetId === n.id ? null : n.id); }}
                  className={'link-handle absolute -bottom-2 -left-2 w-7 h-7 rounded-full flex items-center justify-center '
                    + (targetId === n.id ? 'text-cyan-100' : 'text-cyan-300')}
                  style={{ background: targetId === n.id ? 'rgba(14,116,144,0.95)' : 'rgba(8,47,63,0.95)', border: '1px solid rgba(34,211,238,0.55)', opacity: targetId === n.id ? 1 : undefined, touchAction: 'none' }}
                  title={targetId === n.id ? 'Replying here — click to stop' : 'Reply to this: new thoughts link here'}>
                  <MsgIcon size={12} />
                </button>
                {!n.isHub && n.isQuestion && (
                  <span className="absolute -top-2 -left-2 w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-semibold text-cyan-200 pointer-events-none"
                    style={{ background: 'rgba(8,47,63,0.92)', border: '1px solid rgba(34,211,238,0.5)' }}
                    title="Question — replies thread here">?</span>
                )}
                {n.isHub && (
                  <button data-ui
                    onPointerDown={e => e.stopPropagation()}
                    onClick={e => { e.stopPropagation(); n.collapsed = !n.collapsed; worldRef.current.updated = Date.now(); bump(); }}
                    className="hub-toggle absolute -top-2 -left-2 w-6 h-6 rounded-full flex items-center justify-center text-cyan-200"
                    style={{ background: 'rgba(8,47,63,0.92)', border: '1px solid rgba(34,211,238,0.5)', opacity: n.collapsed ? 1 : undefined }}
                    title={n.collapsed ? 'Expand cluster' : 'Collapse cluster'}>
                    {n.collapsed ? <UnfoldIcon size={12} /> : <FoldIcon size={12} />}
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* marquee */}
      {marquee && (
        <div className="absolute pointer-events-none z-30 rounded"
          style={{ left: marquee.x, top: marquee.y, width: marquee.w, height: marquee.h,
            background: 'rgba(34,211,238,0.07)', border: '1px solid rgba(34,211,238,0.45)' }} />
      )}

      {/* empty state */}
      {!w.nodes.length && (
        <div className="absolute inset-0 flex items-center justify-center">
          <div className="text-center text-slate-500 pointer-events-none">
            <div className="text-4xl mb-3 text-cyan-500/60">✦</div>
            <p className="font-display text-xl text-slate-400">Type a thought below and press Enter.</p>
            <p className="text-sm mt-1.5 text-slate-600">The AI weaves connections as ideas pile up.</p>
            <div className="flex gap-2 justify-center mt-5 pointer-events-auto" data-ui>
              {Object.keys(TEMPLATES).map(name => (
                <button key={name} onClick={() => seedTemplate(name)}
                  className="ghost-btn text-xs text-slate-400 border border-slate-600/40 rounded-full px-3.5 py-1.5">
                  {name}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* linking / replay hint */}
      {(linkFrom || replaying) && (
        <div data-ui className="glass absolute top-20 left-1/2 -translate-x-1/2 rounded-full px-4 py-1.5 text-sm text-cyan-200 z-30">

        </div>
      )}

      {/* header pill */}
      <header data-ui className="glass absolute top-3 left-1/2 -translate-x-1/2 h-12 flex items-center gap-1 px-3 z-40 rounded-2xl max-w-[96vw]">

          <SparkIcon size={17} /> ThoughtStream
        </span>
        <input value={w.name}
          onChange={e => { w.name = e.target.value; w.updated = Date.now(); bump(); }}
          className="bg-transparent text-slate-400 text-sm border-b border-transparent focus:border-slate-500 focus:text-slate-200 px-1 py-0.5 w-36 hidden sm:block"
          spellCheck="false" />
        <div className="w-px h-5 bg-slate-600/40 mx-1 hidden sm:block" />
        <button onClick={newCanvas} title="New Canvas"
          className="ghost-btn flex items-center gap-1.5 text-[13px] text-slate-300 rounded-lg px-2.5 py-1.5">
          <PlusIcon size={14} /> <span className="hidden md:inline">New</span>
        </button>
        <button onClick={() => { persist(); setSessionsRev(r => r + 1); setDrawerOpen(true); }} title="Saved Streams"
          className="ghost-btn flex items-center gap-1.5 text-[13px] text-slate-300 rounded-lg px-2.5 py-1.5">
          <LibraryIcon size={14} /> <span className="hidden md:inline">Streams</span>
        </button>
        <button onClick={() => setPureDump(p => {
            const next = !p;
            if (next) { setActiveSugg(null); }
            else { setTimeout(() => runAI(), 250); } // batch scan on exit
            return next;
          })}
          title={pureDump ? 'Pure Dump is on — AI muted. Click to run a batch analysis.' : 'Pure Dump — mute AI suggestions while you dump thoughts'}
          className={'ghost-btn flex items-center gap-1.5 text-[13px] rounded-lg px-2.5 py-1.5 ' + (pureDump ? 'text-amber-300 bg-amber-400/10' : 'text-slate-300')}>
          <ZapIcon size={14} /> <span className="hidden md:inline">Pure Dump</span>
        </button>
        <div className="relative">
          <button onClick={() => setExportOpen(o => !o)} title="Export"
            className="ghost-btn flex items-center gap-1.5 text-[13px] text-slate-300 rounded-lg px-2.5 py-1.5">
            <DownloadIcon size={14} /> <span className="hidden md:inline">Export</span>
          </button>
          {exportOpen && (
            <div className="glass absolute top-10 right-0 rounded-xl p-1.5 w-44 z-50">
              <button onClick={exportMarkdown} className="ghost-btn w-full text-left text-[13px] text-slate-200 rounded-lg px-3 py-2">Markdown outline</button>
              <button onClick={exportPNG} className="ghost-btn w-full text-left text-[13px] text-slate-200 rounded-lg px-3 py-2">PNG image</button>
            </div>
          )}
        </div>
        <button onClick={() => setSettingsOpen(true)} title="Settings"
          className="ghost-btn flex items-center text-slate-400 rounded-lg px-2 py-1.5">
          <GearIcon size={15} />
        </button>
      </header>

      {/* search pill */}
      <div data-ui className="glass input-glow absolute top-[70px] left-3 h-10 flex items-center gap-2 px-3 z-30 rounded-xl w-52">
        <SearchIcon size={14} className="text-slate-500 shrink-0" />
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Find a thought…"
          className="bg-transparent text-slate-200 placeholder-slate-600 text-[13px] w-full" />
        {query && <button onClick={() => setQuery('')} className="text-slate-500 hover:text-slate-300"><XIcon size={13} /></button>}
      </div>

      {/* toolbar */}
      <div data-ui className="glass absolute right-3 top-1/2 -translate-y-1/2 flex flex-col items-center gap-0.5 p-1.5 z-30 rounded-2xl">
        <button onClick={() => zoomBy(1.25)} title="Zoom in" className="ghost-btn text-slate-300 rounded-lg p-2"><PlusIcon size={15} /></button>
        <button onClick={() => zoomBy(0.8)} title="Zoom out" className="ghost-btn text-slate-300 rounded-lg p-2"><MinusIcon size={15} /></button>
        <button onClick={zoomToFit} title="Zoom to fit" className="ghost-btn text-slate-300 rounded-lg p-2"><FitIcon size={15} /></button>
        <div className="w-6 h-px bg-slate-600/40 my-1" />
        <button onClick={undo} title="Undo (⌘Z)" disabled={!undoStack.current.length}
          className="ghost-btn text-slate-300 disabled:text-slate-700 rounded-lg p-2"><UndoIcon size={15} /></button>
        <button onClick={redo} title="Redo (⇧⌘Z)" disabled={!redoStack.current.length}
          className="ghost-btn text-slate-300 disabled:text-slate-700 rounded-lg p-2"><RedoIcon size={15} /></button>
        <div className="w-6 h-px bg-slate-600/40 my-1" />
        <button onClick={() => { if (!replaying && w.nodes.length) { zoomToFit(); setReplayIdx(0); } }} title="Replay session"
          className={'ghost-btn rounded-lg p-2 ' + (replaying ? 'text-cyan-300' : 'text-slate-300')}><PlayIcon size={15} /></button>
        <button onClick={() => runAI()} title="Synthesize now"
          className={'ghost-btn rounded-lg p-2 ' + (aiBusy ? 'text-cyan-300' : 'text-slate-300')}>
          <span className={aiBusy ? 'spin inline-flex' : 'inline-flex'}><SparkIcon size={15} /></span>
        </button>
      </div>

      {/* AI error note */}
      {aiNote && !pureDump && (
        <div data-ui className="glass absolute bottom-24 right-3 rounded-xl px-3 py-2 text-xs text-amber-300/90 z-30 max-w-[260px]">
          AI fallback: {aiNote}
          <button onClick={() => setAiNote('')} className="ml-2 text-slate-500 hover:text-slate-300">✕</button>
        </div>
      )}

      {/* bottom input */}
      <form data-ui
        onSubmit={e => { e.preventDefault(); addThought(input); setInput(''); }}
        className="absolute bottom-5 left-1/2 -translate-x-1/2 z-30 w-[min(560px,92vw)]">
        {targetNode && (
          <div className="glass rounded-xl flex items-center gap-2 pl-3 pr-2 py-1.5 mb-2 text-[12.5px]">
            <span className="shrink-0">💬</span>
            <span className="text-slate-500 shrink-0">Replying to:</span>
            <span className="text-cyan-200 truncate flex-1 min-w-0">
              “{targetNode.isHub ? targetNode.title : targetNode.text}”
            </span>
            <button type="button" onClick={() => setTargetId(null)}
              className="ghost-btn flex items-center gap-1 text-slate-400 hover:text-slate-200 rounded-md px-2 py-1 text-[11px] shrink-0">
              <XIcon size={11} /> Clear
            </button>
          </div>
        )}
        {/* topic dropdown menu */}
        {topicMenuOpen && (
          <div className="glass absolute bottom-full mb-2 left-2 rounded-xl p-1.5 w-60 z-50" onPointerDown={e => e.stopPropagation()}>
            <button type="button" onClick={() => { setActiveTopic(null); setTopicMenuOpen(false); }}
              className={'ghost-btn w-full text-left text-[13px] rounded-lg px-3 py-2 flex items-center gap-2 ' + (!activeTopic ? 'text-indigo-200' : 'text-slate-300')}>
              <span className="w-2 h-2 rounded-full shrink-0" style={{ background: activeTopic ? 'transparent' : TOPIC_ACCENT, border: '1px solid ' + TOPIC_ACCENT }} />
              No topic <span className="text-slate-600 text-[11px]">— free-floating</span>
            </button>
            {topics.map(t => (
              <button key={t.id} type="button" onClick={() => { setActiveTopic(t.id); setTopicMenuOpen(false); }}
                className={'ghost-btn w-full text-left text-[13px] rounded-lg px-3 py-2 flex items-center gap-2 ' + (activeTopic === t.id ? 'text-indigo-200' : 'text-slate-300')}>
                <span className="w-2 h-2 rounded-full shrink-0" style={{ background: activeTopic === t.id ? TOPIC_ACCENT : 'transparent', border: '1px solid ' + TOPIC_ACCENT }} />
                <span className="truncate">{t.title}</span>
                <span className="text-slate-600 text-[11px] ml-auto shrink-0">{w.nodes.filter(n => n.topicId === t.id).length}</span>
              </button>
            ))}
            <div className="flex items-center gap-1.5 mt-1 pt-1.5 border-t border-slate-700/50 px-1">
              <input value={newTopicName} onChange={e => setNewTopicName(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); if (newTopicName.trim()) { createTopic(newTopicName); setNewTopicName(''); setTopicMenuOpen(false); } } }}
                placeholder="New topic…" autoComplete="off"
                className="flex-1 bg-slate-800/60 border border-slate-600/40 rounded-lg px-2.5 py-1.5 text-slate-100 text-[13px] min-w-0" />
              <button type="button" onClick={() => { if (newTopicName.trim()) { createTopic(newTopicName); setNewTopicName(''); setTopicMenuOpen(false); } }}
                className="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-indigo-200 bg-indigo-500/20 hover:bg-indigo-500/35 border border-indigo-400/40">
                <PlusIcon size={15} />
              </button>
            </div>
          </div>
        )}
        <div className="glass input-glow rounded-2xl flex items-center gap-2 pl-2 pr-2 py-2">
          <button type="button" onClick={() => setTopicMenuOpen(o => !o)}
            title="Choose a topic — new thoughts drift into its cluster"
            className={'flex items-center gap-1.5 shrink-0 rounded-xl px-2.5 h-9 text-[13px] border max-w-[140px] '
              + (activeTopicNode ? 'text-indigo-200 bg-indigo-500/15 border-indigo-400/40' : 'text-slate-400 bg-slate-700/30 border-slate-500/30 hover:text-slate-200')}>
            <span className="shrink-0">◆</span>
            <span className="truncate">{activeTopicNode ? activeTopicNode.title : 'Topic'}</span>
          </button>
          <input id="thought-input" value={input} onChange={e => setInput(e.target.value)} onPaste={onPaste}
            placeholder={activeTopicNode ? `Add to “${activeTopicNode.title}”…` : 'Drop a thought…'} autoComplete="off"
            className="flex-1 bg-transparent text-slate-100 placeholder-slate-500 text-[15px] min-w-0" />
          {speechSupported && (
            <button type="button" onClick={toggleVoice} title={listening ? 'Stop voice capture' : 'Speak thoughts'}
              className={'w-9 h-9 rounded-xl flex items-center justify-center border ' + (listening
                ? 'mic-live text-red-300 bg-red-500/15 border-red-400/40'
                : 'text-slate-400 bg-slate-700/30 border-slate-500/30 hover:text-slate-200')}>
              <MicIcon size={15} />
            </button>
          )}
          <button type="submit"
            className="w-9 h-9 rounded-xl flex items-center justify-center text-cyan-200 bg-cyan-500/20 hover:bg-cyan-500/35 border border-cyan-400/40">
            <SendIcon size={16} />
          </button>
        </div>
        <p className="text-center text-[11px] text-slate-600 mt-1.5">
          Enter to add · ◆ pick a Topic to cluster thoughts · 💬 thread replies · drag 🔗 to link · 📌 pin · click + Del to remove
        </p>
      </form>

      {/* edit modal */}
      {modalNode && (
        <div data-ui className="absolute inset-0 z-40 flex items-center justify-center bg-black/45"
          onPointerDown={e => { e.stopPropagation(); if (e.target === e.currentTarget) setModalId(null); }}>
          <div className="glass rounded-2xl p-5 w-[min(430px,92vw)]">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-display text-slate-100 font-semibold">{modalNode.isHub ? 'Edit Meta-Hub' : 'Edit Thought'}</h3>
              <button onClick={() => setModalId(null)} className="text-slate-400 hover:text-slate-200"><XIcon size={18} /></button>
            </div>
            <label className="text-[11px] uppercase tracking-wider text-slate-500">{modalNode.isHub ? 'Title' : 'Thought'}</label>
            <textarea rows="2" value={modalNode.isHub ? modalNode.title : modalNode.text}
              onChange={e => {
                if (modalNode.isHub) { modalNode.title = e.target.value; modalNode.text = e.target.value; }
                else { modalNode.text = e.target.value; modalNode.isQuestion = /\?\s*$/.test(e.target.value); modalNode.r = nodeRadius(modalNode); }
                worldRef.current.updated = Date.now(); bump();
              }}
              className="w-full mt-1 mb-3 bg-slate-800/60 border border-slate-600/40 rounded-lg p-2.5 text-slate-100 text-sm resize-none" />
            <label className="text-[11px] uppercase tracking-wider text-slate-500">Sub-notes</label>
            <textarea rows="3" value={modalNode.notes} placeholder="Add supporting details…"
              onChange={e => { modalNode.notes = e.target.value; worldRef.current.updated = Date.now(); bump(); }}
              className="w-full mt-1 mb-3 bg-slate-800/60 border border-slate-600/40 rounded-lg p-2.5 text-slate-300 text-sm resize-none" />
            <label className="text-[11px] uppercase tracking-wider text-slate-500">Color</label>
            <div className="flex gap-2 mt-1.5 mb-4">
              {COLORS.map((c, i) => (
                <button key={i} onClick={() => { modalNode.color = i; worldRef.current.updated = Date.now(); bump(); }}
                  className="w-7 h-7 rounded-full"
                  style={{ background: c.dot, outline: modalNode.color === i ? '2px solid white' : 'none', outlineOffset: 2, opacity: 0.85 }}
                  title={i === 0 ? 'Neutral (default)' : ''} />
              ))}
            </div>
            <div className="flex gap-2 mb-2">
              {!modalNode.isHub && (
                <button onClick={() => expandThought(modalNode)} disabled={expandBusy}
                  className="flex-1 flex items-center justify-center gap-1.5 text-sm text-cyan-200 bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-400/40 rounded-lg py-2 disabled:opacity-50">
                  <span className={expandBusy ? 'spin inline-flex' : 'inline-flex'}><SparkIcon size={14} /></span>
                  {expandBusy ? 'Expanding…' : 'Expand ideas'}
                </button>
              )}
              <button onClick={() => { pushUndo(); modalNode.pinned = !modalNode.pinned; modalNode.vx = 0; modalNode.vy = 0; worldRef.current.updated = Date.now(); bump(); }}
                className={'flex-1 flex items-center justify-center gap-1.5 text-sm rounded-lg py-2 border '
                  + (modalNode.pinned ? 'text-amber-300 bg-amber-400/10 border-amber-400/40' : 'text-slate-300 bg-slate-700/30 border-slate-500/30')}>
                <PinIcon size={14} /> {modalNode.pinned ? 'Pinned' : 'Pin'}
              </button>
            </div>
            <button onClick={() => deleteNodes(modalNode.id)}
              className="w-full flex items-center justify-center gap-1.5 text-sm text-red-300 bg-red-500/10 hover:bg-red-500/20 border border-red-400/30 rounded-lg py-2">
              <TrashIcon size={14} /> Delete bubble
            </button>
          </div>
        </div>
      )}

      {/* settings modal */}
      {settingsOpen && (
        <div data-ui className="absolute inset-0 z-40 flex items-center justify-center bg-black/45"
          onPointerDown={e => { e.stopPropagation(); if (e.target === e.currentTarget) setSettingsOpen(false); }}>
          <div className="glass rounded-2xl p-5 w-[min(440px,92vw)]">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-display text-slate-100 font-semibold">Settings</h3>
              <button onClick={() => setSettingsOpen(false)} className="text-slate-400 hover:text-slate-200"><XIcon size={18} /></button>
            </div>
            <label className="text-[11px] uppercase tracking-wider text-slate-500">Anthropic API key</label>
            <input type="password" defaultValue={apiKey} placeholder="sk-ant-…" autoComplete="off"
              onBlur={e => {
                const k = e.target.value.trim();
                setApiKey(k);
                if (k) localStorage.setItem(LS_APIKEY, k); else localStorage.removeItem(LS_APIKEY);
                lastAIHashRef.current = '';
              }}
              className="w-full mt-1 mb-2 bg-slate-800/60 border border-slate-600/40 rounded-lg px-2.5 py-2 text-slate-100 text-sm" />
            <p className="text-xs text-slate-500 leading-relaxed mb-3">
              With a key, connections, clusters, and “Expand ideas” use Claude (claude-opus-4-8) for real semantic analysis.
              Without one, a built-in keyword engine runs offline. The key is stored only in this browser and calls go
              directly to Anthropic — usage is billed to your account.
            </p>
            <div className="flex items-center gap-2 text-sm">
              <span className={'w-2 h-2 rounded-full ' + (apiKey ? 'bg-cyan-400' : 'bg-slate-500')} />
              <span className="text-slate-300">AI mode: {apiKey ? 'Claude API' : 'Simulated (offline)'}</span>
            </div>
          </div>
        </div>
      )}

      {/* library drawer */}
      <div data-ui className={'drawer glass absolute top-0 right-0 bottom-0 w-[min(340px,90vw)] z-50 flex flex-col rounded-l-2xl ' + (drawerOpen ? '' : 'translate-x-full')}
        onPointerDown={e => e.stopPropagation()}>
        <div className="flex items-center justify-between p-4 border-b border-slate-700/50">
          <h2 className="font-display text-slate-100 font-semibold flex items-center gap-2"><LibraryIcon size={17} /> Saved Streams</h2>
          <button onClick={() => setDrawerOpen(false)} className="text-slate-400 hover:text-slate-200"><XIcon size={18} /></button>
        </div>
        <div className="flex-1 overflow-y-auto p-3 space-y-2" key={sessionsRev}>
          {!sessionList.length && <p className="text-slate-500 text-sm text-center mt-8">No saved streams yet.<br/>Canvases autosave as you work.</p>}
          {sessionList.map(s => (
            <div key={s.id}
              className={'rounded-xl p-3 border ' + (s.id === w.id ? 'border-cyan-400/50 bg-cyan-500/10' : 'border-slate-600/30 bg-slate-800/40')}>
              <input defaultValue={s.name}
                onBlur={e => renameSession(s.id, e.target.value.trim() || 'Untitled Stream')}
                onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                className="w-full bg-transparent text-slate-100 text-sm font-medium border-b border-transparent focus:border-slate-500 pb-0.5"
                spellCheck="false" />
              <div className="flex items-center justify-between mt-2">
                <span className="text-[11px] text-slate-500">
                  {(s.nodes || []).filter(n => !n.isHub).length} thoughts · {new Date(s.updated).toLocaleDateString()}
                </span>
                <div className="flex gap-1">
                  <button onClick={() => openSession(s.id)} title="Open"
                    className="text-[11px] px-2 py-1 rounded-md bg-slate-700/50 hover:bg-slate-600/60 text-slate-200">Open</button>
                  <button onClick={() => duplicateSession(s.id)} title="Duplicate"
                    className="px-1.5 py-1 rounded-md bg-slate-700/50 hover:bg-slate-600/60 text-slate-300"><CopyIcon size={12} /></button>
                  <button onClick={() => deleteSession(s.id)} title="Delete"
                    className="px-1.5 py-1 rounded-md bg-slate-700/50 hover:bg-red-500/30 text-slate-300"><TrashIcon size={12} /></button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
